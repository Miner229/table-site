<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #333;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    z-index: 10;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }

  .header-title { display: flex; align-items: center; gap: 15px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; }

  .header-title img {
    height: 80px;
    border-radius: 6px;
    background: white;
    padding: 4px;
  }

  .stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: white;
    cursor: pointer;
    font-weight: 600;
  }

  main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    display: grid;
    gap: 12px;
    box-sizing: border-box;
    grid-template-columns: repeat(2, 1fr);
  }

  .table-box {
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
  }

  .table-title {
    background: #007bff;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 18px;
    font-weight: 900;
  }

  .apparatus {
    padding: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    background: #eef4ff;
    border-bottom: 1px solid #dce2e9;
  }

  .table-wrapper {
    flex: 1;
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 16px;
  }

  th, td {
    border: 1px solid #dce2e9;
    text-align: center;
    padding: 10px;
    font-weight: 700;
  }

  th {
    background: #e6ecf5;
    font-size: 18px;
  }

  tbody tr:nth-child(even) td { background: #f8fafc; }

  .gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
  }

  @media (min-width: 1800px) {
    table { font-size: 26px; }
    th, td { padding: 18px; }
    .table-title { font-size: 28px; }
    .apparatus { font-size: 24px; }
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<header>
  <div class="header-title">
    <h1>ArtVin Cup</h1>
    <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
         alt="Логотип"
         onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
  </div>
  <select id="streamSelect" class="stream-select">
    <option value="" disabled selected>Выберите поток</option>
    <option value="1">поток 1</option>
    <option value="2">поток 2</option>
    <option value="3">поток 3</option>
    <option value="4">поток 4</option>
    <option value="5">поток 5</option>
    <option value="6">поток 6</option>
    <option value="7">поток 7</option>
  </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = '1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w';

const STREAMS = {
  1: { sheet: 'поток 1', ranges: ['A2:B9','D2:E13','G2:H14','A16:B28','D16:E27','G16:H28'] },
  2: { sheet: 'поток 2', ranges: ['A3:B16','D3:E15','G3:H14','A18:B29','D17:E26','G17:H26'] },
  3: { sheet: 'поток 3', ranges: ['A2:B14','D2:E13','A16:B28','D16:E28'] },
  4: { sheet: 'поток 4', ranges: ['A3:B15','D3:E16','G3:H14','A18:B31','D18:E31','G18:H31','A33:B44'] },
  5: { sheet: 'поток 5', ranges: ['A3:B14','D3:E13','G3:H14','A17:B27','D17:E27'] },
  6: { sheet: 'поток 6', ranges: ['A2:B8','D2:E8','G2:H8'] },
  7: { sheet: 'поток 7', ranges: ['A2:B13','D2:E14','A16:B27','D16:E26'] }
};

const container = document.getElementById('tables');
const select = document.getElementById('streamSelect');

let allTablesHTML = [];
let pageIndex = 0;
let intervalId = null;
let refreshId = null;
let requestToken = 0;

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

// парсим google.visualization.Query.setResponse(...)
function parseGvizJSON(text) {
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1) {
    throw new Error('GViz JSON: invalid format');
  }
  return JSON.parse(text.slice(start, end + 1));
}

// достаём значение ячейки
function getCell(row, idx) {
  const c = row.c && row.c[idx];
  if (!c || c.v === null || typeof c.v === 'undefined') return '';
  return String(c.v);
}

function buildUrl(sheet, range) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

async function loadTable(sheet, range, title, token) {
  const res = await fetch(buildUrl(sheet, range));
  const text = await res.text();
  if (token !== requestToken) return null;

  const json = parseGvizJSON(text);
  const cols = json.table && json.table.cols ? json.table.cols : [];
  const gRows = json.table && json.table.rows ? json.table.rows : [];
  if (!gRows.length) return null;

  // превращаем все строки в [fio, score]
  const rows = gRows.map(r => [getCell(r, 0), getCell(r, 1)]);

  // ---------- СНАРЯД ----------
  // у GViz первая строка диапазона обычно уходит в label колонки
  let apparatus = '';
  if (cols[0] && cols[0].label) {
    apparatus = String(cols[0].label).trim();
  }

  // если label пустой/мусорный — пробуем взять первую строку
  if (!apparatus && rows.length) {
    apparatus = (rows[0][0] || '').trim();
  }

  // чистим от "ФИО" / "Оценка"
  if (apparatus) {
    apparatus = apparatus
      .replace(/\bФИО\b/gi, '')
      .replace(/\bОценка\b/gi, '')
      .replace(/[,;]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  if (!apparatus) apparatus = 'Снаряд';

  // ---------- УЧАСТНИКИ ----------
  const participants = [];

  rows.forEach(([fioRaw, scoreRaw]) => {
    const fio = (fioRaw || '').trim();
    const score = (scoreRaw || '').trim();

    if (!fio && !score) return;          // пустая строка
    if (/фио/i.test(fio)) return;        // шапка "ФИО"
    if (/оценка/i.test(fio)) return;     // на всякий случай

    participants.push([fio, score]);
  });

  // ---------- ЗОЛОТО ----------
  let maxScore = -Infinity;
  participants.forEach(([fio, score]) => {
    const val = parseFloat(score.replace(',', '.'));
    if (!isNaN(val) && val > maxScore) maxScore = val;
  });

  // ---------- HTML ----------
  let html = `
    <div class="table-box">
      <div class="table-title">${title}</div>
      <div class="apparatus">${apparatus}</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ФИО</th>
              <th>Оценка</th>
            </tr>
          </thead>
          <tbody>
  `;

  participants.forEach(([fio, score]) => {
    const num = parseFloat(score.replace(',', '.'));
    const gold = (!isNaN(num) && num === maxScore) ? 'gold' : '';
    html += `
      <tr class="${gold}">
        <td>${fio}</td>
        <td>${score}</td>
      </tr>
    `;
  });

  html += `
          </tbody>
        </table>
      </div>
    </div>
  `;

  return html;
}

function renderPage() {
  container.innerHTML = '';
  const start = pageIndex * PAGE_SIZE;
  const slice = allTablesHTML.slice(start, start + PAGE_SIZE);
  slice.forEach(html => container.insertAdjacentHTML('beforeend', html));

  const totalPages = Math.max(1, Math.ceil(allTablesHTML.length / PAGE_SIZE));
  pageIndex = (pageIndex + 1) % totalPages;
}

async function refreshTables(stream) {
  const cfg = STREAMS[stream];
  if (!cfg) return;
  const token = requestToken;

  const list = [];
  for (let i = 0; i < cfg.ranges.length; i++) {
    try {
      const html = await loadTable(cfg.sheet, cfg.ranges[i], `Таблица ${i + 1}`, token);
      if (html) list.push(html);
    } catch {
      list.push(`
        <div class="table-box">
          <div class="table-title">Таблица ${i + 1}</div>
          <div style="padding:10px;text-align:center;color:#c00;">Ошибка загрузки</div>
        </div>
      `);
    }
  }

  if (token === requestToken) {
    allTablesHTML = list;
  }
}

async function renderStream(stream) {
  const cfg = STREAMS[stream];
  if (!cfg) {
    container.innerHTML = "<p style='text-align:center;color:#c00;'>Нет данных</p>";
    return;
  }

  container.innerHTML = "<p style='text-align:center;color:#555;'>Загрузка…</p>";

  if (intervalId) clearInterval(intervalId);
  if (refreshId) clearInterval(refreshId);

  requestToken++;
  const token = requestToken;

  const list = [];
  for (let i = 0; i < cfg.ranges.length; i++) {
    try {
      const html = await loadTable(cfg.sheet, cfg.ranges[i], `Таблица ${i + 1}`, token);
      if (html) list.push(html);
    } catch {
      list.push(`
        <div class="table-box">
          <div class="table-title">Таблица ${i + 1}</div>
          <div style="padding:10px;text-align:center;color:#c00;">Ошибка загрузки</div>
        </div>
      `);
    }
  }

  if (token !== requestToken) return;

  allTablesHTML = list;
  pageIndex = 0;
  renderPage();

  intervalId = setInterval(renderPage, ROTATE_MS);
  refreshId = setInterval(() => refreshTables(stream), REFRESH_MS);
}

select.addEventListener('change', () => renderStream(select.value));
</script>

</body>
</html>
