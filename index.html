<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг потоков</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }

    .buttons {
      text-align: center;
      margin-bottom: 25px;
    }

    .buttons button {
      margin: 5px;
      padding: 10px 20px;
      border: 1px solid #007bff;
      border-radius: 5px;
      background: #fff;
      color: #007bff;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .buttons button.active {
      background: #007bff;
      color: #fff;
      font-weight: bold;
    }

    .buttons button:hover {
      background: #0056b3;
      color: #fff;
    }

    .table-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #007bff;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    .table-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Рейтинг участников</h1>

  <div class="buttons" id="streamButtons">
    <button data-stream="1" class="active">Поток 1</button>
    <button data-stream="2">Поток 2</button>
    <button data-stream="3">Поток 3</button>
    <button data-stream="4">Поток 4</button>
    <button data-stream="5">Поток 5</button>
    <button data-stream="6">Поток 6</button>
    <button data-stream="7">Поток 7</button>
  </div>

  <div class="table-container" id="tables"></div>

  <script>
    // ссылки на Google Sheets для каждого потока
    const STREAM_URLS = {
      1: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG-ocGlYtU5yccH2ly3d3Vi4iVCVClBeT2_ER_dCHE1Xe0VdpK5KBa7ZaTRk8tFsTTwZcP7-7trIKK/pub?output=csv&sheet=",
      2: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК2/pub?output=csv&sheet=",
      3: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК3/pub?output=csv&sheet=",
      4: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК4/pub?output=csv&sheet=",
      5: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК5/pub?output=csv&sheet=",
      6: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК6/pub?output=csv&sheet=",
      7: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК7/pub?output=csv&sheet="
    };

    const TABLES_PER_STREAM = 6;
    const container = document.getElementById("tables");
    const buttons = document.querySelectorAll("#streamButtons button");

    async function loadSheet(sheetUrl, sheetName) {
      const url = sheetUrl + sheetName;
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.trim().split("\n").map(r => r.split(","));
      let html = `<div><div class='table-title'>${sheetName.toUpperCase()}</div>`;
      html += `<table><thead><tr><th>ФИО</th><th>Баллы</th></tr></thead><tbody>`;
      for (let i = 1; i < rows.length; i++) {
        if (!rows[i][0]) continue;
        html += `<tr><td>${rows[i][0]}</td><td>${rows[i][1]}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      return html;
    }

    async function renderStream(stream) {
      container.innerHTML = "";
      const baseUrl = STREAM_URLS[stream];
      if (!baseUrl) {
        container.innerHTML = `<p style="text-align:center;color:red;">Поток ${stream} не найден</p>`;
        return;
      }

      for (let i = 1; i <= TABLES_PER_STREAM; i++) {
        const sheetName = `table${i}`;
        try {
          const html = await loadSheet(baseUrl, sheetName);
          container.innerHTML += html;
        } catch (err) {
          container.innerHTML += `<div class='table-title'>${sheetName}</div><p style="color:red;text-align:center;">Ошибка загрузки</p>`;
        }
      }
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        const stream = button.getAttribute("data-stream");
        localStorage.setItem("lastStream", stream);
        renderStream(stream);
      });
    });

    const last = localStorage.getItem("lastStream") || "1";
    document.querySelector(`#streamButtons button[data-stream="${last}"]`).classList.add("active");
    renderStream(last);

    setInterval(() => {
      const active = document.querySelector("#streamButtons button.active").getAttribute("data-stream");
      renderStream(active);
    }, 20 * 60 * 1000); // обновление каждые 20 минут
  </script>
</body>
</html>
