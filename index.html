<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>

<style>
  body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
  }

  .header-title { display: flex; gap: 15px; align-items: center; }
  .header-title img { height: 80px; padding: 4px; background: white; border-radius: 6px; }

  main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 14px;
    overflow: hidden;
  }

  .table-box {
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .table-title {
    background: #007bff;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
  }

  .apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
  }

  th, td {
    border: 1px solid #dce2e9;
    padding: 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
  }

  th { background: #e6ecf5; font-size: 20px; }

  tr:nth-child(even) td { background: #f8fafc; }

  .gold td { background: #ffe680 !important; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>

<header>
  <div class="header-title">
    <h1>ArtVin Cup</h1>
    <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg">
  </div>

  <select id="streamSelect" style="padding:8px;font-size:16px;border-radius:6px;">
    <option disabled selected>Выберите поток</option>
    <option value="1">поток 1</option>
    <option value="2">поток 2</option>
    <option value="3">поток 3</option>
    <option value="4">поток 4</option>
    <option value="5">поток 5</option>
    <option value="6">поток 6</option>
    <option value="7">поток 7</option>
  </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet:"поток 1", ranges:["A2:B9","D2:E13","G2:H14","A16:B28","D16:E27","G16:H28"] },
  2: { sheet:"поток 2", ranges:["A3:B16","D3:E15","G3:H14","A18:B29","D17:E26","G17:H26"] },
  3: { sheet:"поток 3", ranges:["A2:B14","D2:E13","A16:B28","D16:E28"] },
  4: { sheet:"поток 4", ranges:["A3:B15","D3:E16","G3:H14","A18:B31","D18:E31","G18:H31","A33:B44"] },
  5: { sheet:"поток 5", ranges:["A3:B14","D3:E13","G3:H14","A17:B27","D17:E27"] },
  6: { sheet:"поток 6", ranges:["A2:B8","D2:E8","G2:H8"] },
  7: { sheet:"поток 7", ranges:["A2:B13","D2:E14","A16:B27","D16:E26"] }
};

function parseCSV(text) {
  return text.trim().split(/\r?\n/).map(
    line => line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(val =>
      val.replace(/^"+|"+$/g,"").trim()
    )
  );
}

async function loadTable(sheet, range, number) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cache=${Date.now()}`;
  const res = await fetch(url);
  const rows = parseCSV(await res.text());

  if (!rows.length) return "";

  const apparatus = rows[0][0] || "Снаряд";
  const headers = rows[1] || ["ФИО","Оценка"];
  const participants = rows.slice(2);

  let max = -999;
  participants.forEach(r=>{
    const s = parseFloat(r[1]);
    if (!isNaN(s)) max = Math.max(max, s);
  });

  let html = `
  <div class="table-box">
    <div class="table-title">Таблица ${number}</div>
    <div class="apparatus">${apparatus}</div>
    <table>
      <thead><tr>
  `;

  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr></thead><tbody>";

  participants.forEach(r=>{
    if (!r[0]) return;
    const s = parseFloat(r[1]);
    const cls = (!isNaN(s) && s === max) ? "gold" : "";
    html += `<tr class="${cls}"><td>${r[0]}</td><td>${r[1]}</td></tr>`;
  });

  html += "</tbody></table></div>";
  return html;
}

async function renderStream(stream) {
  const cfg = STREAMS[stream];
  const box = document.getElementById("tables");
  box.innerHTML = "";

  let html = "";

  for (let i = 0; i < cfg.ranges.length; i++) {
    html += await loadTable(cfg.sheet, cfg.ranges[i], i+1);
  }

  box.innerHTML = html;
}

document.getElementById("streamSelect").addEventListener("change", e => {
  renderStream(e.target.value);
});
</script>

</body>
</html>
