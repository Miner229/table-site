<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Таблицы участников</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 30px;
    }
    .table-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* ровно три в ряд */
      gap: 25px;
      max-width: 1400px; /* ограничиваем ширину */
      margin: 0 auto; /* выравниваем по центру */
      padding: 0 20px;
    }

    @media (max-width: 1200px) {
      .table-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 800px) {
      .table-container {
        grid-template-columns: 1fr;
      }
    }


    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: #fff;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .table-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Рейтинг участников</h1>
  <div class="table-container" id="tables"></div>

  <script>
    // Одна ссылка на всю таблицу (не на лист)
    const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG-ocGlYtU5yccH2ly3d3Vi4iVCVClBeT2_ER_dCHE1Xe0VdpK5KBa7ZaTRk8tFsTTwZcP7-7trIKK/pub?output=csv&sheet=";

    // Названия листов (вкладок) в Google Sheets
    const SHEETS = ["table1", "table2", "table3", "table4", "table5", "table6"];

    async function loadSheet(sheetName) {
      const url = BASE_URL + sheetName;
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.trim().split("\n").map(r => r.split(","));

      let html = `<div><div class='table-title'>${sheetName.toUpperCase()}</div>`;
      html += `<table><thead><tr><th>ФИО</th><th>Баллы</th></tr></thead><tbody>`;
      for (let i = 1; i < rows.length; i++) {
        if (!rows[i][0]) continue;
        html += `<tr><td>${rows[i][0]}</td><td>${rows[i][1]}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      return html;
    }

    async function renderAll() {
      const container = document.getElementById("tables");
      container.innerHTML = "";
      for (let sheet of SHEETS) {
        try {
          const html = await loadSheet(sheet);
          container.innerHTML += html;
        } catch (err) {
          container.innerHTML += `<div class='table-title'>${sheet}</div><p style="color:red;text-align:center;">Ошибка загрузки</p>`;
        }
      }
    }

    renderAll();
    setInterval(renderAll, 20 * 60 * 1000); // обновление каждые 20 минут
  </script>
</body>
</html>
