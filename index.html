<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
        padding: 10px;
    }
    th, td { font-size: 14px; padding: 6px 4px; }
    .apparatus { font-size: 16px; padding: 8px; }
    tbody tr { height: 28px; }
}
</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A2:F14","A16:F30"] },
  2: { sheet: "поток 2", ranges: ["A3:F17","A18:F30"] },
  3: { sheet: "поток 3", ranges: ["A2:F15","A16:F29"] },
  4: { sheet: "поток 4", ranges: ["A3:F16","A18:F32","A33:F45"] },
  5: { sheet: "поток 5", ranges: ["A3:F15","A17:F28"] },
  6: { sheet: "поток 6", ranges: ["A2:F9"] },
  7: { sheet: "поток 7", ranges: ["A2:F14","A16:F28"] }
};

const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

let allTables = [];
let pageIndex = 0;
let rotateTimer = null;
let refreshTimer = null;
let currentStream = null;
let loadGeneration = 0;

// CSV parser with row padding
function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line => {
        const cols = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(v =>
            v.replace(/^"+|"+$/g,"").trim()
        );
        return cols;
    });
}

// pad to same column count
function normalizeRows(rows) {
    let maxCols = 0;
    rows.forEach(r => maxCols = Math.max(maxCols, r.length));
    return rows.map(r => {
        while (r.length < maxCols) r.push("");
        return r;
    });
}

function buildCsvUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

function parseScore(val) {
    if (!val) return NaN;
    const num = parseFloat(val.replace(",", "."));
    return isNaN(num) ? NaN : num;
}

// MAIN TABLE PARSER (fixes everything)
function parseTable(rows, index) {
    rows = normalizeRows(rows);

    const left = (index % 2 === 1);  
    const offset = left ? 0 : 3;      

    const COL_FIO = offset;
    const COL_SCORE = offset + 1;

    const hasData = rows.some(r => (r[COL_FIO] || r[COL_SCORE]));
    if (!hasData) {
        return `
        <div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus" style="color:#999;">Нет данных</div>
        </div>`;
    }

    let apparatus = "";
    let headerIdx = null;

    // find first non-empty for apparatus
    for (let i = 0; i < rows.length; i++) {
        if (rows[i][COL_FIO]) {
            apparatus = rows[i][COL_FIO];
            headerIdx = i + 1;
            break;
        }
    }
    if (!apparatus) apparatus = "Снаряд";

    const headerRow = rows[headerIdx] || [];
    const nameHeader = headerRow[COL_FIO] || "ФИО";
    const scoreHeader = headerRow[COL_SCORE] || "ОЦЕНКА";

    const participants = rows.slice(headerIdx + 1);

    function getScore(r) {
        return (r[COL_SCORE] && r[COL_SCORE].trim())
            ? r[COL_SCORE].trim()
            : "-";
    }

    let maxScore = -Infinity;
    participants.forEach(r => {
        const s = parseScore(getScore(r));
        if (!isNaN(s) && s > maxScore) maxScore = s;
    });

    let html = `
    <div class="table-box">
        <div class="table-title">Таблица ${index}</div>
        <div class="apparatus">${apparatus}</div>
        <table>
            <thead>
                <tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr>
            </thead>
            <tbody>
    `;

    participants.forEach(r => {
        const fio = r[COL_FIO] || "-";
        const score = getScore(r);
        const num = parseScore(score);
        const isGold = (!isNaN(num) && Math.abs(num - maxScore) < 1e-6);

        html += `
        <tr class="${isGold ? "gold" : ""}">
            <td>${fio}</td>
            <td>${score}</td>
        </tr>`;
    });

    html += "</tbody></table></div>";
    return html;
}

async function loadTable(sheet, range, index, gen) {
    try {
        const res = await fetch(buildCsvUrl(sheet, range));
        if (!res.ok) throw new Error("Ошибка сети");
        const text = await res.text();
        if (gen !== loadGeneration) return null;

        let rows = parseCSV(text).filter(r => r.some(c => c !== ""));
        return parseTable(rows, index);

    } catch {
        return `
        <div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus" style="color:#c00;">Ошибка загрузки</div>
        </div>`;
    }
}

function renderPage() {
    if (!allTables.length) {
        container.innerHTML = "<p style='text-align:center;color:#555;'>Нет данных для этого потока</p>";
        return;
    }

    const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
    if (pageIndex >= totalPages) pageIndex = 0;

    const start = pageIndex * PAGE_SIZE;
    const slice = allTables.slice(start, start + PAGE_SIZE);

    container.style.gridTemplateColumns = `repeat(${slice.length},1fr)`;
    container.innerHTML = slice.join("");

    pageIndex++;
}

async function refreshTables() {
    if (!currentStream) return;
    const cfg = STREAMS[currentStream];
    const gen = ++loadGeneration;

    const tables = [];
    let idx = 1;

    for (let range of cfg.ranges) {
        tables.push(await loadTable(cfg.sheet, range, idx++, gen));
        tables.push(await loadTable(cfg.sheet, range, idx++, gen));
    }

    if (gen !== loadGeneration) return;
    allTables = tables;
}

async function renderStream(stream) {
    currentStream = stream;
    container.innerHTML = "<p style='text-align:center;'>Загрузка...</p>";

    clearInterval(rotateTimer);
    clearInterval(refreshTimer);

    const cfg = STREAMS[stream];
    const gen = ++loadGeneration;

    const tables = [];
    let idx = 1;

    for (let range of cfg.ranges) {
        tables.push(await loadTable(cfg.sheet, range, idx++, gen));
        tables.push(await loadTable(cfg.sheet, range, idx++, gen));
    }

    if (gen !== loadGeneration) return;

    allTables = tables;
    pageIndex = 0;
    renderPage();

    rotateTimer = setInterval(renderPage, ROTATE_MS);
    refreshTimer = setInterval(refreshTables, REFRESH_MS);
}

select.addEventListener("change", () => {
    const s = select.value;
    if (s) renderStream(s);
});
</script>

</body>
</html>
