<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг потоков</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f7f9fb;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden; /* убираем скролл */
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #007bff;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .stream-select {
      font-size: 16px;
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      color: #007bff;
      background: white;
      cursor: pointer;
      outline: none;
      font-weight: 500;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      height: calc(100% - 70px); /* остальное пространство под таблицы */
      padding: 10px 20px;
      box-sizing: border-box;
    }

    .table-box {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      border-radius: 5px;
      overflow: hidden;
    }

    .table-title {
      background: #007bff;
      color: #fff;
      text-align: center;
      padding: 6px;
      font-size: 15px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      flex-grow: 1;
      font-size: 14px;
    }

    th, td {
      padding: 5px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #e9ecef;
      color: #333;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    @media (max-width: 1000px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Рейтинг участников</h1>
    <select id="streamSelect" class="stream-select">
      <option value="1">Поток 1</option>
      <option value="2">Поток 2</option>
      <option value="3">Поток 3</option>
      <option value="4">Поток 4</option>
      <option value="5">Поток 5</option>
      <option value="6">Поток 6</option>
      <option value="7">Поток 7</option>
    </select>
  </header>

  <div class="dashboard" id="tables"></div>

  <script>
    // ссылки на Google Sheets для каждого потока
    const STREAM_URLS = {
      1: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG-ocGlYtU5yccH2ly3d3Vi4iVCVClBeT2_ER_dCHE1Xe0VdpK5KBa7ZaTRk8tFsTTwZcP7-7trIKK/pub?output=csv&sheet=",
      2: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК2/pub?output=csv&sheet=",
      3: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК3/pub?output=csv&sheet=",
      4: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК4/pub?output=csv&sheet=",
      5: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК5/pub?output=csv&sheet=",
      6: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК6/pub?output=csv&sheet=",
      7: "https://docs.google.com/spreadsheets/d/e/ВАША_ССЫЛКА_ПОТОК7/pub?output=csv&sheet="
    };

    const TABLES_PER_STREAM = 6;
    const container = document.getElementById("tables");
    const streamSelect = document.getElementById("streamSelect");

    async function loadSheet(sheetUrl, sheetName) {
      const url = sheetUrl + sheetName;
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.trim().split("\n").map(r => r.split(","));
      let html = `<div class='table-box'><div class='table-title'>${sheetName.toUpperCase()}</div>`;
      html += `<table><thead><tr><th>ФИО</th><th>Баллы</th></tr></thead><tbody>`;
      for (let i = 1; i < rows.length; i++) {
        if (!rows[i][0]) continue;
        html += `<tr><td>${rows[i][0]}</td><td>${rows[i][1]}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      return html;
    }

    async function renderStream(stream) {
      container.innerHTML = "";
      const baseUrl = STREAM_URLS[stream];
      if (!baseUrl) {
        container.innerHTML = `<p style="text-align:center;color:red;">Поток ${stream} не найден</p>`;
        return;
      }

      for (let i = 1; i <= TABLES_PER_STREAM; i++) {
        const sheetName = `table${i}`;
        try {
          const html = await loadSheet(baseUrl, sheetName);
          container.innerHTML += html;
        } catch {
          container.innerHTML += `<div class='table-box'><div class='table-title'>${sheetName}</div><p style="color:red;text-align:center;">Ошибка загрузки</p></div>`;
        }
      }
    }

    streamSelect.addEventListener("change", () => {
      const stream = streamSelect.value;
      renderStream(stream);
      localStorage.setItem("lastStream", stream);
    });

    const last = localStorage.getItem("lastStream") || "1";
    streamSelect.value = last;
    renderStream(last);

    setInterval(() => renderStream(streamSelect.value), 20 * 60 * 1000);
  </script>
</body>
</html>
