<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
        padding: 10px;
    }
    th, td { font-size: 14px; padding: 6px 4px; }
    .apparatus { font-size: 16px; padding: 8px; }
    tbody tr { height: 28px; }
}
</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
// ===============================
//     НАДЁЖНЫЙ ПАРСЕР ОЦЕНОК
// ===============================
function parseScore(value) {
    if (!value) return NaN;

    value = value
        .replace(/[\u0000-\u001F\u007F-\u009F]/g, "")   // управляющие символы
        .replace(/[\u00A0\u1680\u180E\u2000-\u200F\u2028\u2029\u202F\u205F\u3000]/g, "") // невидимые пробелы
        .replace(/\s+/g, "")                           // обычные пробелы
        .replace(",", ".")                             // запятая → точка
        .trim();

    const num = Number(value);
    return Number.isFinite(num) ? num : NaN;
}


// ===============================
//     CSV ПАРСЕР
// ===============================
function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line =>
        line
            .split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
            .map(v => v.replace(/^"+|"+$/g, "").trim())
    );
}


// ===============================
//     ПОИСК ЗАГОЛОВКА
// ===============================
function findHeaderIndex(rows) {
    for (let i = 0; i < rows.length; i++) {
        const col1 = rows[i][0]?.toLowerCase().replace(/\s+/g, "") || "";
        const col2 = rows[i][1]?.toLowerCase().replace(/\s+/g, "") || "";

        if (col1.includes("фио")) return i;
        if (col2.includes("оценка") || col2.includes("балл")) return i;
    }
    return -1;
}


// ===============================
//     ПОИСК СТРОКИ СНАРЯДА
// ===============================
function extractApparatus(rows, headerIndex) {
    // если строка заголовка не первая → первая строка = снаряд
    if (headerIndex > 0) {
        const text = rows[0].join(" ")
            .replace(/фио/gi, "")
            .replace(/оценка/gi, "")
            .trim();
        if (text) return text;
    }
    return "";
}


const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A2:B9","D2:E13","G2:H14","A16:B28","D16:E27","G16:H28"] },
  2: { sheet: "поток 2", ranges: ["A3:B16","D3:E15","G3:H14","A18:B29","D17:E26","G17:H26"] },
  3: { sheet: "поток 3", ranges: ["A2:B14","D2:E13","A16:B28","D16:E28"] },
  4: { sheet: "поток 4", ranges: ["A3:B15","D3:E16","G3:H14","A18:B31","D18:E31","G18:H31","A33:B44"] },
  5: { sheet: "поток 5", ranges: ["A3:B14","D3:E13","G3:H14","A17:B27","D17:E27"] },
  6: { sheet: "поток 6", ranges: ["A2:B8","D2:E8","G2:H8"] },
  7: { sheet: "поток 7", ranges: ["A2:B13","D2:E14","A16:B27","D16:E26"] }
};

const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

let allTables = [];
let pageIndex = 0;
let rotateTimer = null;
let refreshTimer = null;
let currentStream = null;
let loadGeneration = 0;


// ===============================
//     URL CSV
// ===============================
function buildCsvUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}


// ===============================
//     Загрузка таблицы
// ===============================
async function loadTable(sheet, range, index, gen) {
    try {
        const res = await fetch(buildCsvUrl(sheet, range));
        if (!res.ok) throw new Error("Ошибка сети");

        const text = await res.text();
        if (gen !== loadGeneration) return null;

        let rows = parseCSV(text);

        rows = rows.filter(r => !(r.length === 0 || r.every(c => c.trim() === "")));

        if (!rows.length) throw new Error("Нет данных");

        const headerIndex = findHeaderIndex(rows);
        const apparatusText = extractApparatus(rows, headerIndex) || "Снаряд";

        let hdr = headerIndex !== -1 ? rows[headerIndex] : ["ФИО", "Оценка"];
        const nameHeader = hdr[0] || "ФИО";
        const scoreHeader = hdr[1] || "Оценка";

        const participants = rows.slice(headerIndex + 1);

        // Ищем максимальную оценку
        let maxScore = -Infinity;
        participants.forEach(r => {
            const num = parseScore(r[1] || "");
            if (!isNaN(num) && num > maxScore) maxScore = num;
        });

        // Формируем HTML
        let html = `<div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus">${apparatusText}</div>
            <table>
            <thead><tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr></thead>
            <tbody>`;

        participants.forEach(row => {
            const fio = (row[0] || "-").trim();
            let score = (row[1] || "").trim();
            const num = parseScore(score);
            const isGold = !isNaN(num) && Math.abs(num - maxScore) < 0.000001;

            if (!score || isNaN(num)) score = "-";

            html += `<tr class="${isGold ? "gold" : ""}">
                        <td>${fio}</td>
                        <td>${score}</td>
                    </tr>`;
        });

        html += `</tbody></table></div>`;
        return html;

    } catch (err) {
        return `<div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus" style="color:#c00;">Нет данных</div>
        </div>`;
    }
}


// ===============================
//     Страницы
// ===============================
function renderPage() {
    if (!allTables.length) {
        container.innerHTML = "<p style='text-align:center;color:#555;'>Нет данных</p>";
        return;
    }

    const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
    if (pageIndex >= totalPages) pageIndex = 0;

    const slice = allTables.slice(pageIndex * PAGE_SIZE, pageIndex * PAGE_SIZE + PAGE_SIZE);
    container.style.gridTemplateColumns = `repeat(${slice.length}, 1fr)`;
    container.innerHTML = slice.join("");

    pageIndex++;
}


// ===============================
//     Обновление данных
// ===============================
async function refreshTables() {
    if (!currentStream) return;

    const cfg = STREAMS[currentStream];
    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));
    }

    if (gen !== loadGeneration) return;
    allTables = tables;
}


// ===============================
//     Отображение потока
// ===============================
async function renderStream(stream) {
    const cfg = STREAMS[stream];
    currentStream = stream;

    if (!cfg) {
        container.innerHTML = "<p style='text-align:center;color:#c00;'>Нет данных</p>";
        return;
    }

    container.innerHTML = "<p style='text-align:center;color:#777;'>Загрузка...</p>";
    clearInterval(rotateTimer);
    clearInterval(refreshTimer);

    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));
    }

    if (gen !== loadGeneration) return;

    allTables = tables;
    pageIndex = 0;
    renderPage();

    if (allTables.length > PAGE_SIZE) {
        rotateTimer = setInterval(renderPage, ROTATE_MS);
    }
    refreshTimer = setInterval(refreshTables, REFRESH_MS);
}


// ===============================
//     Слушатель селекта
// ===============================
select.addEventListener("change", () => {
    if (select.value) renderStream(select.value);
});


</script>

</body>
</html>
