<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
        padding: 10px;
    }
    th, td { font-size: 14px; padding: 6px 4px; }
    .apparatus { font-size: 16px; padding: 8px; }
    tbody tr { height: 28px; }
}
</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
// ===============================
//     НАДЁЖНЫЙ ПАРСЕР ОЦЕНОК
// ===============================
function parseScore(value) {
    if (!value) return NaN;

    value = value
        .replace(/[\u0000-\u001F\u007F-\u009F]/g, "")   // управляющие символы
        .replace(/[\u00A0\u1680\u180E\u2000-\u200F\u2028\u2029\u202F\u205F\u3000]/g, "") // невидимые пробелы
        .replace(/\s+/g, "")                           // обычные пробелы
        .replace(",", ".")                             // запятая → точка
        .trim();

    const num = Number(value);
    return Number.isFinite(num) ? num : NaN;
}

// ===============================
//     CSV ПАРСЕР
// ===============================
function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line =>
        line
            .split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
            .map(v => v.replace(/^"+|"+$/g, "").trim())
    );
}

// ===============================
//     НАСТРОЙКИ ПОТОКОВ
//  (диапазоны с захватом строки
//   снаряда и возможной колонки C)
// ===============================
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A1:C9","D1:F13","G1:I14","A15:C28","D15:F27","G15:I28"] },
  2: { sheet: "поток 2", ranges: ["A2:C16","D2:F15","G2:I14","A17:C29","D16:F26","G16:I26"] },
  3: { sheet: "поток 3", ranges: ["A1:C14","D1:F13","A15:C28","D15:F28"] },
  4: { sheet: "поток 4", ranges: ["A2:C15","D2:F16","G2:I14","A17:C31","D17:F31","G17:I31","A32:C44"] },
  5: { sheet: "поток 5", ranges: ["A2:C14","D2:F13","G2:I14","A16:C27","D16:F27"] },
  6: { sheet: "поток 6", ranges: ["A1:C8","D1:F8","G1:I8"] },
  7: { sheet: "поток 7", ranges: ["A1:C13","D1:F14","A15:C27","D15:F26"] }
};

const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

let allTables = [];
let pageIndex = 0;
let rotateTimer = null;
let refreshTimer = null;
let currentStream = null;
let loadGeneration = 0;

// ===============================
//   URL для CSV Google Sheets
// ===============================
function buildCsvUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

// ===============================
//   ЗАГРУЗКА И РАЗБОР ТАБЛИЦЫ
// ===============================
async function loadTable(sheet, range, index, gen) {
    try {
        const res = await fetch(buildCsvUrl(sheet, range));
        if (!res.ok) throw new Error("Ошибка сети");

        const text = await res.text();
        if (gen !== loadGeneration) return null;

        let rows = parseCSV(text);

        // Убираем полностью пустые строки
        rows = rows.filter(r => !(r.length === 0 || r.every(c => c.trim() === "")));
        if (!rows.length) throw new Error("Нет данных");

        // ===============================
        // 1. ОПРЕДЕЛЯЕМ СНАРЯД И ЗАГОЛОВОК
        // ===============================
        let apparatusText = "Снаряд";
        let headerRow;
        let dataStartIndex;

        const firstRowText = rows[0].join(" ").toLowerCase();

        // Если первая строка НЕ содержит "фио"/"оценка" и НЕ содержит цифр → это снаряд
        if (!firstRowText.includes("фио") && !firstRowText.includes("оценка") && !/\d/.test(firstRowText)) {
            apparatusText = rows[0].join(" ").trim();
            headerRow = rows[1];
            dataStartIndex = 2;
        } else {
            // Иначе считаем, что снаряда нет, а первая строка сразу заголовок
            headerRow = rows[0];
            dataStartIndex = 1;
        }

        // Название колонок
        const nameHeader = headerRow[0] || "ФИО";

        // Определяем индекс колонки с оценкой по слову "ОЦЕНКА" или "БАЛЛ"
        let scoreColIndex = 1;
        for (let j = 1; j < headerRow.length; j++) {
            const col = (headerRow[j] || "").toLowerCase();
            if (col.includes("оцен") || col.includes("балл")) {
                scoreColIndex = j;
                break;
            }
        }
        const scoreHeader = headerRow[scoreColIndex] || "ОЦЕНКА";

        // Участники
        const participants = rows.slice(dataStartIndex);

        // ===============================
        // 2. НАХОДИМ МАКСИМАЛЬНУЮ ОЦЕНКУ
        // ===============================
        let maxScore = -Infinity;
        participants.forEach(r => {
            let scoreText = r[scoreColIndex] || "";

            // Если в основной колонке пусто — ищем оценку правее (как у Салмана 9.5)
            if (!scoreText.trim()) {
                for (let j = scoreColIndex + 1; j < r.length; j++) {
                    if (!r[j]) continue;
                    const num = parseScore(r[j]);
                    if (!isNaN(num)) {
                        scoreText = r[j];
                        break;
                    }
                }
            }

            const num = parseScore(scoreText);
            if (!isNaN(num) && num > maxScore) maxScore = num;
        });

        // ===============================
        // 3. СБОР HTML
        // ===============================
        let html = `<div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus">${apparatusText}</div>
            <table>
                <thead>
                    <tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr>
                </thead>
                <tbody>`;

        participants.forEach(r => {
            const fio = (r[0] || "-").trim();

            let scoreText = r[scoreColIndex] || "";
            // Если основная колонка пустая — ищем оценку правее
            if (!scoreText.trim()) {
                for (let j = scoreColIndex + 1; j < r.length; j++) {
                    if (!r[j]) continue;
                    const numTmp = parseScore(r[j]);
                    if (!isNaN(numTmp)) {
                        scoreText = r[j];
                        break;
                    }
                }
            }

            const num = parseScore(scoreText);
            const isGold = !isNaN(num) && Math.abs(num - maxScore) < 1e-6;

            if (!scoreText || isNaN(num)) scoreText = "-";

            html += `<tr class="${isGold ? "gold" : ""}">
                        <td>${fio}</td>
                        <td>${scoreText}</td>
                    </tr>`;
        });

        html += `</tbody></table></div>`;
        return html;

    } catch (err) {
        console.error("Ошибка таблицы:", err);
        return `<div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus" style="color:#c00;">Нет данных</div>
        </div>`;
    }
}

// ===============================
//     ОТРИСОВКА СТРАНИЦ
// ===============================
function renderPage() {
    if (!allTables.length) {
        container.innerHTML = "<p style='text-align:center;color:#555;'>Нет данных</p>";
        return;
    }

    const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
    if (pageIndex >= totalPages) pageIndex = 0;

    const slice = allTables.slice(pageIndex * PAGE_SIZE, pageIndex * PAGE_SIZE + PAGE_SIZE);
    container.style.gridTemplateColumns = `repeat(${Math.min(slice.length, 2)}, 1fr)`;
    container.innerHTML = slice.join("");

    pageIndex++;
}

// ===============================
//     АВТО-ОБНОВЛЕНИЕ
// ===============================
async function refreshTables() {
    if (!currentStream) return;

    const cfg = STREAMS[currentStream];
    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));
    }

    if (gen !== loadGeneration) return;
    allTables = tables;
}

// ===============================
//     ЗАГРУЗКА ПОТОКА
// ===============================
async function renderStream(stream) {
    const cfg = STREAMS[stream];
    currentStream = stream;

    if (!cfg) {
        container.innerHTML = "<p style='text-align:center;color:#c00;'>Нет данных</p>";
        return;
    }

    container.innerHTML = "<p style='text-align:center;color:#777;'>Загрузка...</p>";
    clearInterval(rotateTimer);
    clearInterval(refreshTimer);

    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));
    }

    if (gen !== loadGeneration) return;

    allTables = tables;
    pageIndex = 0;
    renderPage();

    if (allTables.length > PAGE_SIZE) {
        rotateTimer = setInterval(renderPage, ROTATE_MS);
    }
    refreshTimer = setInterval(refreshTables, REFRESH_MS);
}

// ===============================
//     ВЫБОР ПОТОКА
// ===============================
select.addEventListener("change", () => {
    if (select.value) renderStream(select.value);
});


</script>

</body>
</html>
