<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #333;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    z-index: 10;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }

  .header-title { display: flex; align-items: center; gap: 15px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; }
  .header-title img { height: 80px; border-radius: 6px; background: #fff; padding: 4px; }

  .stream-select {
    font-size: 16px; padding: 8px 14px; border: none;
    border-radius: 6px; color: #007bff; background: #fff;
    cursor: pointer; font-weight: 600;
  }

  main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    display: grid;
    gap: 12px;
    box-sizing: border-box;
    grid-template-columns: repeat(2, 1fr);
  }

  .table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 18px;
    font-weight: 900;
  }

  .table-wrapper {
    flex: 1;
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
    table-layout: fixed;
  }

  td {
    border: 1px solid #dce2e9;
    text-align: center;
    padding: 10px;
    font-weight: 700;
  }

  tbody tr:nth-child(odd) { background: #f7faff; }
  tbody tr:first-child {
    background: #eef2f7;
    font-weight: 900;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>ArtVin Cup</h1>
    <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
         alt="Логотип"
         onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
  </div>
  <select id="streamSelect" class="stream-select">
    <option value="" disabled selected>Выберите поток</option>
    <option value="1">поток 1</option>
    <option value="2">поток 2</option>
    <option value="3">поток 3</option>
    <option value="4">поток 4</option>
    <option value="5">поток 5</option>
    <option value="6">поток 6</option>
    <option value="7">поток 7</option>
  </select>
</header>

<main id="tables"></main>

<script>
  const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

  const STREAMS = {
    1: { sheet: "поток 1", ranges: ["A2:B9","D2:E13","G2:H14","A16:B28","D16:E27","G16:H28"] },
    2: { sheet: "поток 2", ranges: ["A3:B15","D3:E15","G3:H14","A17:B28","D17:E26","G17:H26"] },
    3: { sheet: "поток 3", ranges: ["A2:B14","D2:E13","A16:B28","D16:E28"] },
    4: { sheet: "поток 4", ranges: ["A3:B15","D3:E16","G3:H14","A18:B31","D18:E31","G18:H31","A33:B44"] },
    5: { sheet: "поток 5", ranges: ["A3:B14","D3:E13","G3:H14","A17:B27","D17:E26"] },
    6: { sheet: "поток 6", ranges: ["A2:B8","D2:E8","G2:H8"] },
    7: { sheet: "поток 7", ranges: ["A2:B13","D2:E14","A16:B27","D16:E26"] }
  };

  const container = document.getElementById("tables");
  const select = document.getElementById("streamSelect");

  let allTablesHTML = [];
  let pageIndex = 0;
  let intervalId = null;
  let refreshId = null;
  let requestToken = 0;

  const PAGE_SIZE = 2;
  const ROTATE_MS = 20000;
  const REFRESH_MS = 20000;

  function buildUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
  }

  function cleanCell(text) {
    return text.replace(/^"+|"+$/g, "").replace(/""/g, '"').trim();
  }

  function parseCSV(text) {
    return text.trim().split("\n").map(line =>
      line.split(",").map(cleanCell)
    );
  }

  async function loadTable(sheet, range, title, token) {
    const res = await fetch(buildUrl(sheet, range));
    const text = await res.text();
    if (token !== requestToken) return null;

    const rows = parseCSV(text);
    if (!rows.length) {
      return `
        <div class="table-box">
          <div class="table-title">${title}</div>
          <div class="table-wrapper"><table><tbody>
            <tr><td>Пусто</td></tr>
          </tbody></table></div>
        </div>`;
    }

    let html = `
      <div class="table-box">
        <div class="table-title">${title}</div>
        <div class="table-wrapper">
          <table><tbody>`;

    rows.forEach((row, index) => {
      const nonEmpty = row.filter(c => c.trim() !== "");

      // 🔥 Автоматическое объединение первой строки (название снаряда)
      if (index === 0 && nonEmpty.length === 1) {
        html += `
          <tr>
            <td colspan="${row.length}"
                style="
                  font-weight:900;
                  text-align:center;
                  font-size:20px;
                  background:#eef2f7;
                ">
              ${nonEmpty[0]}
            </td>
          </tr>`;
      } else {
        html += "<tr>";
        row.forEach(cell => {
          html += `<td>${cell}</td>`;
        });
        html += "</tr>";
      }
    });

    html += `
          </tbody></table>
        </div>
      </div>`;

    return html;
  }

  function renderPage() {
    if (!allTablesHTML.length) return;

    container.innerHTML = "";
    const start = pageIndex * PAGE_SIZE;
    const slice = allTablesHTML.slice(start, start + PAGE_SIZE);

    slice.forEach(html => container.insertAdjacentHTML("beforeend", html));

    const totalPages = Math.ceil(allTablesHTML.length / PAGE_SIZE);
    pageIndex = (pageIndex + 1) % totalPages;
  }

  async function refreshTables(streamKey) {
    const cfg = STREAMS[streamKey];
    if (!cfg) return;

    const token = requestToken;
    const updated = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
      const html = await loadTable(cfg.sheet, cfg.ranges[i], `Таблица ${i+1}`, token);
      if (html) updated.push(html);
    }

    if (token === requestToken) {
      allTablesHTML = updated;
    }
  }

  async function renderStream(streamKey) {
    const cfg = STREAMS[streamKey];
    if (!cfg) {
      container.innerHTML = "<p style='text-align:center;color:red;'>Нет данных</p>";
      return;
    }

    container.innerHTML = "<p style='text-align:center;color:#555;'>Загрузка...</p>";

    if (intervalId) clearInterval(intervalId);
    if (refreshId) clearInterval(refreshId);

    requestToken++;
    const token = requestToken;
    allTablesHTML = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
      const html = await loadTable(cfg.sheet, cfg.ranges[i], `Таблица ${i+1}`, token);
      if (html) allTablesHTML.push(html);
    }

    pageIndex = 0;
    renderPage();

    intervalId = setInterval(renderPage, ROTATE_MS);
    refreshId = setInterval(() => refreshTables(streamKey), REFRESH_MS);
  }

  select.addEventListener("change", () => renderStream(select.value));
</script>

</body>
</html>
