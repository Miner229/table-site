<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг участников</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #007bff;
    }
    table {
      width: 60%;
      margin: 30px auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: #fff;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Рейтинг участников</h1>
  <table id="score-table">
    <thead>
      <tr><th>ФИО</th><th>Баллы</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG-ocGlYtU5yccH2ly3d3Vi4iVCVClBeT2_ER_dCHE1Xe0VdpK5KBa7ZaTRk8tFsTTwZcP7-7trIKK/pub?output=csv";

    async function loadData() {
      try {
        const response = await fetch(SHEET_URL);
        if (!response.ok) throw new Error("Ошибка загрузки данных");
        const data = await response.text();
        const rows = data.trim().split("\n").map(r => r.split(","));
        
        const tbody = document.querySelector("#score-table tbody");
        tbody.innerHTML = "";

        for (let i = 1; i < rows.length; i++) {
          const fio = rows[i][0]?.trim() || "";
          const score = rows[i][1]?.trim() || "";
          if (!fio) continue;
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${fio}</td><td>${score}</td>`;
          tbody.appendChild(tr);
        }
      } catch (err) {
        console.error(err);
        document.querySelector("#score-table tbody").innerHTML = 
          `<tr><td colspan="2" style="color:red;">Ошибка загрузки данных</td></tr>`;
      }
    }

    loadData();
    setInterval(loadData, 20 * 60 * 1000);
  </script>
</body>
</html>
