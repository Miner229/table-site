<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    z-index: 10;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }

  .header-title { display: flex; align-items: center; gap: 15px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; }

  .header-title img {
    height: 80px;
    border-radius: 6px;
    background: white;
    padding: 4px;
  }

  .stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    font-weight: 600;
    color: #007bff;
  }

  main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    overflow-y: auto;
  }

  .table-box {
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .table-title {
    background: #007bff;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 18px;
    font-weight: 900;
  }

  .apparatus {
    padding: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    background: #eef4ff;
    border-bottom: 1px solid #dce2e9;
  }

  .table-wrapper {
    overflow: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 18px;
  }

  th, td {
    border: 1px solid #dce2e9;
    text-align: center;
    padding: 12px;
    font-weight: 700;
  }

  th {
    background: #e6ecf5;
  }

  tbody tr:nth-child(even) td { background: #f8fafc; }

  .gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    table { font-size: 16px; }
    th, td { padding: 8px; }
  }
</style>
</head>

<body>

<header>
  <div class="header-title">
    <h1>ArtVin Cup</h1>
    <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
         onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
  </div>

  <select id="streamSelect" class="stream-select">
    <option value="" disabled selected>Выберите поток</option>
    <option value="1">поток 1</option>
    <option value="2">поток 2</option>
    <option value="3">поток 3</option>
    <option value="4">поток 4</option>
    <option value="5">поток 5</option>
    <option value="6">поток 6</option>
    <option value="7">поток 7</option>
  </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A2:B9","D2:E13","G2:H14","A16:B28","D16:E27","G16:H28"] },
  2: { sheet: "поток 2", ranges: ["A3:B16","D3:E15","G3:H14","A18:B29","D17:E26","G17:H26"] },
  3: { sheet: "поток 3", ranges: ["A2:B14","D2:E13","A16:B28","D16:E28"] },
  4: { sheet: "поток 4", ranges: ["A3:B15","D3:E16","G3:H14","A18:B31","D18:E31","G18:H31","A33:B44"] },
  5: { sheet: "поток 5", ranges: ["A3:B14","D3:E13","G3:H14","A17:B27","D17:E27"] },
  6: { sheet: "поток 6", ranges: ["A2:B8","D2:E8","G2:H8"] },
  7: { sheet: "поток 7", ranges: ["A2:B13","D2:E14","A16:B27","D16:E26"] }
};

function gvizUrl(sheet, range) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
         `tqx=out:json&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

function getCell(row, idx) {
  if (!row || !row.c || !row.c[idx]) return "";
  const c = row.c[idx];
  if (c.f !== undefined) return String(c.f);
  if (c.v !== undefined) return String(c.v);
  return "";
}

async function loadTable(sheet, range, title) {
  const res = await fetch(gvizUrl(sheet, range));
  const text = await res.text();
  const json = JSON.parse(text.substr(47).slice(0,-2));

  const cols = json.table.cols;
  const rows = json.table.rows;

  // ➜ СНАРЯД
  let apparatus = cols[0].label || getCell(rows[0], 0);
  apparatus = apparatus.trim();

  if (/фио/i.test(apparatus) || /оценка/i.test(apparatus))
    apparatus = getCell(rows[0], 0);

  if (!apparatus || /фио/i.test(apparatus))
    apparatus = "Снаряд";

  // ➜ ДАННЫЕ
  const participants = [];
  for (let i = 1; i < rows.length; i++) {
    const fio = getCell(rows[i], 0).trim();
    const score = getCell(rows[i], 1).trim();

    if (!fio || /фио/i.test(fio)) continue;

    participants.push([fio, score]);
  }

  // GOLD
  let maxScore = -999999;
  for (const p of participants) {
    let val = parseFloat(p[1].replace(",", "."));
    if (!isNaN(val)) maxScore = Math.max(maxScore, val);
  }

  // HTML
  let html = `
    <div class="table-box">
      <div class="table-title">${title}</div>
      <div class="apparatus">${apparatus}</div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>ФИО</th><th>Оценка</th></tr></thead>
          <tbody>
  `;

  for (const [fio, score] of participants) {
    const num = parseFloat(score.replace(",", "."));
    const gold = (num === maxScore && !isNaN(num)) ? "gold" : "";
    html += `<tr class="${gold}"><td>${fio}</td><td>${score}</td></tr>`;
  }

  html += `</tbody></table></div></div>`;
  return html;
}

async function renderStream(stream) {
  const cfg = STREAMS[stream];
  const box = document.getElementById("tables");
  box.innerHTML = "<p style='text-align:center;'>Загрузка...</p>";

  const tables = [];

  for (let i = 0; i < cfg.ranges.length; i++) {
    const html = await loadTable(cfg.sheet, cfg.ranges[i], `Таблица ${i+1}`);
    tables.push(html);
  }

  box.innerHTML = tables.join("");
}

document.getElementById("streamSelect").addEventListener("change", e => {
  renderStream(e.target.value);
});
</script>

</body>
</html>
