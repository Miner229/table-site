<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Рейтинг потоков</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow-x: hidden;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #333;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: #007bff;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
  }

  .stream-select {
    font-size: 15px;
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 500;
  }

  main {
    position: absolute;
    top: 60px; bottom: 0; left: 0; right: 0;
    display: grid;
    gap: 10px;
    padding: 10px;
    box-sizing: border-box;
    transition: grid-template-columns 0.3s;
  }

  .table-box {
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 6px;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    flex-grow: 1;
    font-size: 13px;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ddd;
    text-align: center;
    word-wrap: break-word;
    padding: 4px;
  }

  th {
    background: #e9ecef;
    font-weight: 600;
  }

  tr:nth-child(even) {
    background-color: #f8f9fa;
  }

  /* 🔹 адаптив под разные экраны */
  @media (max-width: 900px) {
    main {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }

  @media (max-width: 600px) {
    main {
      grid-template-columns: 1fr !important;
    }
    .table-title { font-size: 14px; }
    table { font-size: 12px; }
    th, td { padding: 3px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Рейтинг участников</h1>
    <select id="streamSelect" class="stream-select">
      <option value="" disabled selected>Выберите поток</option>
      <option value="1">Поток 1</option>
      <option value="2">Поток 2</option>
      <option value="3">Поток 3</option>
      <option value="4">Поток 4</option>
      <option value="5">Поток 5</option>
      <option value="6">Поток 6</option>
      <option value="7">Поток 7</option>
    </select>
  </header>

  <main id="tables"></main>

  <script>
    // 🧩 Конфигурация потоков: ID таблицы, имя листа, диапазоны
    const STREAM_CONFIG = {
      1: { id: "ID_ПОТОК1", name: "Поток 1", ranges: ["A1:B5","A7:B11","A13:B17","A19:B23","A25:B29","A31:B35"] },
      2: { id: "ID_ПОТОК2", name: "Поток 2", ranges: ["A1:B6","A8:B13","A15:B20","A22:B27"] },
      3: { id: "ID_ПОТОК3", name: "Поток 3", ranges: ["A1:B5","A7:B11","A13:B17","A19:B23","A25:B29","A31:B35"] },
      4: { id: "ID_ПОТОК4", name: "Поток 4", ranges: ["A1:B6","A8:B13","A15:B20","A22:B27"] },
      5: { id: "ID_ПОТОК5", name: "Поток 5", ranges: ["A1:B5","A7:B11","A13:B17","A19:B23","A25:B29","A31:B35"] },
      6: { id: "ID_ПОТОК6", name: "Поток 6", ranges: ["A1:B5","A7:B11","A13:B17","A19:B23","A25:B29","A31:B35"] },
      7: { id: "ID_ПОТОК7", name: "Поток 7", ranges: ["A1:B5","A7:B11","A13:B17","A19:B23"] }
    };

    const container = document.getElementById("tables");
    const select = document.getElementById("streamSelect");

    async function loadTable(baseId, sheetName, range, title) {
      const url = `https://docs.google.com/spreadsheets/d/${baseId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&range=${range}`;
      const response = await fetch(url);
      const text = await response.text();
      const rows = text.trim().split("\n").map(r => r.split(","));
      let html = `<div class="table-box"><div class="table-title">${title}</div><table><thead><tr>`;
      rows[0].forEach(cell => html += `<th>${cell}</th>`);
      html += `</tr></thead><tbody>`;
      for (let i = 1; i < rows.length; i++) {
        if (!rows[i][0]) continue;
        html += `<tr>${rows[i].map(c => `<td>${c}</td>`).join("")}</tr>`;
      }
      html += `</tbody></table></div>`;
      return html;
    }

    async function renderStream(stream) {
      container.innerHTML = "<p style='text-align:center;color:#555;'>Загрузка...</p>";

      const cfg = STREAM_CONFIG[stream];
      if (!cfg) {
        container.innerHTML = "<p style='color:red;text-align:center;'>Нет данных для этого потока</p>";
        return;
      }

      // 🔸 Количество колонок
      const count = cfg.ranges.length;
      if (count <= 4) container.style.gridTemplateColumns = "repeat(2, 1fr)";
      else container.style.gridTemplateColumns = "repeat(3, 1fr)";

      container.innerHTML = "";

      for (let i = 0; i < cfg.ranges.length; i++) {
        try {
          const html = await loadTable(cfg.id, cfg.name, cfg.ranges[i], `Таблица ${i + 1}`);
          container.insertAdjacentHTML("beforeend", html);
        } catch {
          container.insertAdjacentHTML("beforeend",
            `<div class="table-box"><div class="table-title">Таблица ${i + 1}</div><p style='color:red;text-align:center;'>Ошибка загрузки</p></div>`);
        }
      }
    }

    select.addEventListener("change", () => renderStream(select.value));
  </script>
</body>
</html>
