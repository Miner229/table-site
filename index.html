<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

/* МОБИЛЬНАЯ ВЕРСИЯ — таблица в полный размер */
@media (max-width: 900px) {

    /* Одна таблица в ряд */
    main {
        grid-template-columns: 1fr !important;
        gap: 20px !important;
        padding: 10px !important;
        overflow-y: auto !important;
    }

    /* Таблица должна быть полной ширины */
    .table-box {
        width: 100% !important;
    }

    table {
        width: 100% !important;
        min-width: 100% !important;
        table-layout: auto !important;
    }

    /* Колонки не схлопываются, ФИО и оценка остаются нормальными */
    th, td {
        white-space: normal !important;
        font-size: 16px !important;
        padding: 10px 6px !important;
    }

    /* Чтобы если фамилия слишком длинная — она переносилась */
    td {
        word-break: break-word !important;
    }

    body {
        overflow-y: auto !important;
    }
}


</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A2:B9","D2:E13","G2:H14","A16:B28","D16:E27","G16:H28"] },
  2: { sheet: "поток 2", ranges: ["A3:B16","D3:E15","G3:H14","A18:B29","D17:E26","G17:H26"] },
  3: { sheet: "поток 3", ranges: ["A2:B14","D2:E13","A16:B28","D16:E28"] },
  4: { sheet: "поток 4", ranges: ["A3:B15","D3:E16","G3:H14","A18:B31","D18:E31","G18:H31","A33:B44"] },
  5: { sheet: "поток 5", ranges: ["A3:B14","D3:E13","G3:H14","A17:B27","D17:E27"] },
  6: { sheet: "поток 6", ranges: ["A2:B8","D2:E8","G2:H8"] },
  7: { sheet: "поток 7", ranges: ["A2:B13","D2:E14","A16:B27","D16:E26"] }
};

const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

const PAGE_SIZE  = 2;       // показываем по 2 таблицы
const ROTATE_MS  = 20000;   // листаем страницы
const REFRESH_MS = 20000;   // перезагружаем данные

let allTables      = [];
let pageIndex      = 0;
let rotateTimer    = null;
let refreshTimer   = null;
let currentStream  = null;
let loadGeneration = 0;

// ---------- CSV ----------

function parseCSV(text) {
  return text
    .trim()
    .split(/\r?\n/)
    .map(line =>
      line
        .split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)
        .map(v => v.replace(/^"+|"+$/g, "").trim())
    );
}

function buildCsvUrl(sheet, range) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(
    sheet
  )}&range=${range}&cacheBust=${Date.now()}`;
}

function parseScore(val) {
  if (!val) return NaN;
  const num = Number(val.replace(",", ".").trim());
  return Number.isFinite(num) ? num : NaN;
}

// ---------- Загрузка одной таблицы из диапазона ----------

async function loadTable(sheet, range, index, gen) {
  try {
    const res = await fetch(buildCsvUrl(sheet, range));
    if (!res.ok) throw new Error("network");
    const text = await res.text();

    if (gen !== loadGeneration) return null; // уже новая загрузка

    let rows = parseCSV(text).filter(r => r.some(c => c !== ""));
    if (rows.length < 3) {
      return `
        <div class="table-box">
          <div class="table-title">Таблица ${index}</div>
          <div class="apparatus" style="color:#999;">Нет данных</div>
        </div>`;
    }

    // 1-я строка диапазона — название снаряда (В/У, Бревно и т.д.)
    const apparatusText = rows[0][0] || "Снаряд";

    // 2-я строка — заголовки ФИО / ОЦЕНКА
    const headerRow   = rows[1] || [];
    const nameHeader  = headerRow[0] || "ФИО";
    const scoreHeader = headerRow[1] || "ОЦЕНКА";

    // Остальные строки — участники
    const participants = rows.slice(2);

    // Находим максимальную оценку
    let maxScore = -Infinity;
    participants.forEach(r => {
      const s = parseScore(r[1]);
      if (!isNaN(s) && s > maxScore) maxScore = s;
    });

    // Сбор HTML
    let html = `
      <div class="table-box">
        <div class="table-title">Таблица ${index}</div>
        <div class="apparatus">${apparatusText}</div>
        <table>
          <thead>
            <tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr>
          </thead>
          <tbody>
    `;

    participants.forEach(r => {
      const fioRaw   = r[0] || "";
      const scoreRaw = r[1] || "";

      const fio   = fioRaw.trim() || "-";
      let score   = scoreRaw.toString().trim();
      const num   = parseScore(score);
      const isGold = !isNaN(num) && Math.abs(num - maxScore) < 1e-6;

      if (!score || isNaN(num)) score = "-";

      html += `
        <tr class="${isGold ? "gold" : ""}">
          <td>${fio}</td>
          <td>${score}</td>
        </tr>`;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    return html;
  } catch (e) {
    console.error("loadTable error:", e);
    return `
      <div class="table-box">
        <div class="table-title">Таблица ${index}</div>
        <div class="apparatus" style="color:#c00;">Ошибка загрузки</div>
      </div>`;
  }
}

// ---------- Пагинация (по 2 таблицы) ----------

function renderPage() {
  if (!allTables.length) {
    container.innerHTML =
      "<p style='text-align:center;color:#555;'>Нет данных для этого потока</p>";
    return;
  }

  const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
  if (pageIndex >= totalPages) pageIndex = 0;

  const start = pageIndex * PAGE_SIZE;
  const slice = allTables.slice(start, start + PAGE_SIZE);

  container.style.gridTemplateColumns = `repeat(${slice.length}, 1fr)`;
  container.innerHTML = slice.join("");

  pageIndex++;
}

// ---------- Загрузка всех таблиц потока ----------

async function loadAllTablesForStream(stream) {
  const cfg = STREAMS[stream];
  if (!cfg) return;

  const gen = ++loadGeneration;

  const promises = cfg.ranges.map((range, idx) =>
    loadTable(cfg.sheet, range, idx + 1, gen)
  );

  const tables = await Promise.all(promises);
  if (gen !== loadGeneration) return;

  allTables = tables;
  pageIndex = 0;
  renderPage();
}

// ---------- Переключение потока ----------

async function renderStream(stream) {
  currentStream = stream;
  container.innerHTML =
    "<p style='text-align:center;color:#555;'>Загрузка...</p>";

  clearInterval(rotateTimer);
  clearInterval(refreshTimer);

  await loadAllTablesForStream(stream);

  if (allTables.length > PAGE_SIZE) {
    rotateTimer = setInterval(renderPage, ROTATE_MS);
  }
  refreshTimer = setInterval(() => {
    if (currentStream) loadAllTablesForStream(currentStream);
  }, REFRESH_MS);
}

select.addEventListener("change", () => {
  const s = select.value;
  if (s) renderStream(s);
});
</script>


</body>
</html>
