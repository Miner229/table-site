<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
        padding: 10px;
    }
    th, td { font-size: 14px; padding: 6px 4px; }
    .apparatus { font-size: 16px; padding: 8px; }
    tbody tr { height: 28px; }
}
</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A2:C14","D2:F17","G2:I18","A16:C30","D16:F28","G16:I30"] },
  2: { sheet: "поток 2", ranges: ["A3:C17","D3:F16","G3:I15","A18:C30","D17:F27","G17:I27"] },
  3: { sheet: "поток 3", ranges: ["A2:C15","D2:F14","A16:C29","D16:F29"] },
  4: { sheet: "поток 4", ranges: ["A3:C16","D3:F17","G3:I15","A18:C32","D18:F32","G18:I32","A33:C45"] },
  5: { sheet: "поток 5", ranges: ["A3:C15","D3:F14","G3:I15","A17:C28","D17:F28"] },
  6: { sheet: "поток 6", ranges: ["A2:C9","D2:F9","G2:I9"] },
  7: { sheet: "поток 7", ranges: ["A2:C14","D2:F15","A16:C28","D16:F27"] }
};

// === Интерфейс ===
const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

let allTables = [];
let pageIndex = 0;
let rotateTimer = null;
let refreshTimer = null;
let currentStream = null;
let loadGeneration = 0;

// === CSV парсер ===
function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line =>
        line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(v => 
            v.replace(/^"+|"+$/g,"").trim()
        )
    );
}

// === URL CSV ===
function buildCsvUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

// === Parse score safely ===
function parseScore(val) {
    if (!val) return NaN;
    const num = parseFloat(val.replace(",", "."));
    return isNaN(num) ? NaN : num;
}

// === Load one table ===
async function loadTable(sheet, range, index, gen) {
    try {
        const res = await fetch(buildCsvUrl(sheet, range));
        if (!res.ok) throw new Error("Ошибка сети");
        const text = await res.text();
        if (gen !== loadGeneration) return null;

        let rows = parseCSV(text).filter(r => r.some(c => c !== ""));
        if (rows.length < 2) throw new Error("Нет данных");

        // === ЧИТАЕМ СТРОГО КАК В GOOGLE SHEET ===

        // 1. Снаряд
        const apparatusText = rows[0][0] || "Снаряд";

        // 2. Заголовок ФИО / ОЦЕНКА
        const headerRow = rows[1];
        const nameHeader = headerRow[0] || "ФИО";
        const scoreHeader = headerRow[1] || "ОЦЕНКА";

        // 3. Участники
        const participants = rows.slice(2);

        function getScore(r) {
            if (r[1] && r[1].trim()) return r[1].trim();
            if (r[2] && r[2].trim()) return r[2].trim();
            return "-";
        }

        // 4. Максимальный балл
        let maxScore = -Infinity;
        participants.forEach(r => {
            const s = parseScore(getScore(r));
            if (!isNaN(s) && s > maxScore) maxScore = s;
        });

        // 5. Генерация HTML
        let html = `
        <div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus">${apparatusText}</div>
            <table>
                <thead>
                    <tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr>
                </thead>
                <tbody>
        `;

        participants.forEach(r => {
            const fio = r[0] || "-";
            const score = getScore(r);
            const num = parseScore(score);
            const isGold = !isNaN(num) && Math.abs(num - maxScore) < 1e-6;

            html += `
            <tr class="${isGold ? "gold" : ""}">
                <td>${fio}</td>
                <td>${score}</td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
        return html;

    } catch {
        return `
        <div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus" style="color:#c00;">Нет данных</div>
        </div>`;
    }
}

// === Render one page (2 таблицы) ===
function renderPage() {
    if (!allTables.length) {
        container.innerHTML =
            "<p style='text-align:center;color:#555;'>Нет данных для этого потока</p>";
        return;
    }

    const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
    if (pageIndex >= totalPages) pageIndex = 0;

    const start = pageIndex * PAGE_SIZE;
    const slice = allTables.slice(start, start + PAGE_SIZE);

    container.style.gridTemplateColumns =
        `repeat(${Math.min(slice.length, 2)}, 1fr)`;

    container.innerHTML = slice.join("");

    pageIndex++;
}

// === Reload tables ===
async function refreshTables() {
    if (!currentStream) return;
    const cfg = STREAMS[currentStream];
    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        const html = await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen);
        tables.push(html);
    }

    if (gen !== loadGeneration) return;
    allTables = tables;
}

// === Main load ===
async function renderStream(stream) {
    const cfg = STREAMS[stream];
    currentStream = stream;

    container.innerHTML = "<p style='text-align:center;color:#555;'>Загрузка...</p>";

    clearInterval(rotateTimer);
    clearInterval(refreshTimer);

    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++) {
        const html = await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen);
        tables.push(html);
    }

    if (gen !== loadGeneration) return;

    allTables = tables;
    pageIndex = 0;
    renderPage();

    if (allTables.length > PAGE_SIZE)
        rotateTimer = setInterval(renderPage, ROTATE_MS);

    refreshTimer = setInterval(refreshTables, REFRESH_MS);
}

// === Selector ===
select.addEventListener("change", () => {
    const s = select.value;
    if (s) renderStream(s);
});
</script>

</body>
</html>
