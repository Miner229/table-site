<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtVin Cup</title>
<style>
body {
    margin: 0;
    background: #f7f9fb;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
}

header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: #0069d9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.header-title img {
    height: 80px;
    width: auto;
    border-radius: 6px;
    background: #fff;
    padding: 4px;
}

.stream-select {
    font-size: 16px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    color: #007bff;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
}

main {
    position: absolute;
    top: 100px; bottom: 0; left: 0; right: 0;
    padding: 10px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.table-box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.table-title {
    background: #007bff;
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 20px;
    font-weight: 900;
}

.apparatus {
    background: #eef4ff;
    padding: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    border-bottom: 1px solid #dce2e9;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #dce2e9;
    padding: 10px 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    max-width: none;
    overflow-wrap: break-word;
    white-space: nowrap;
}

tbody tr {
    height: 30px;
}

th {
    background: #e6ecf5;
    font-size: 18px;
}

tbody tr:nth-child(even) td {
    background: #f8fafc;
}

.gold td {
    background: #ffe680 !important;
    font-weight: 900 !important;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
        padding: 10px;
    }
    th, td { font-size: 14px; padding: 6px 4px; }
    .apparatus { font-size: 16px; padding: 8px; }
    tbody tr { height: 28px; }
}
</style>
</head>

<body>
<header>
    <div class="header-title">
        <h1>ArtVin Cup</h1>
        <img src="https://raw.githubusercontent.com/Miner229/table-site/main/ArtVinCup.jpg"
             alt="Логотип"
             onerror="this.src='https://miner229.github.io/table-site/ArtVinCup.jpg';">
    </div>
    <select id="streamSelect" class="stream-select">
        <option value="" disabled selected>Выберите поток</option>
        <option value="1">поток 1</option>
        <option value="2">поток 2</option>
        <option value="3">поток 3</option>
        <option value="4">поток 4</option>
        <option value="5">поток 5</option>
        <option value="6">поток 6</option>
        <option value="7">поток 7</option>
    </select>
</header>

<main id="tables"></main>

<script>
// ===============================
//     ПАРСЕР ОЦЕНОК
// ===============================
function parseScore(v) {
    if (!v) return NaN;
    v = v.replace(",", ".").trim();
    const num = Number(v);
    return Number.isFinite(num) ? num : NaN;
}

// ===============================
//     CSV ПАРСЕР
// ===============================
function parseCSV(text) {
    return text.trim().split(/\r?\n/).map(line =>
        line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(v => v.replace(/^"+|"+$/g, "").trim())
    );
}

// ===============================
//     ПОТОКИ (ДИАПАЗОНЫ A1:CXXX)
// ===============================
const SHEET_ID = "1NCLssbli5uUVMNLn88zw8n2RdzHTaZrumR9AP0Zvd9w";

const STREAMS = {
  1: { sheet: "поток 1", ranges: ["A1:C14","D1:F26","G1:I26"] },
  2: { sheet: "поток 2", ranges: ["A1:C16","D1:F26","G1:I26"] },
  3: { sheet: "поток 3", ranges: ["A1:C14","D1:F13","A15:C28","D15:F28"] },
  4: { sheet: "поток 4", ranges: ["A1:C15","D1:F16","G1:I14","A17:C31","D17:F31","G17:I31"] },
  5: { sheet: "поток 5", ranges: ["A1:C14","D1:F13","G1:I14","A16:C27","D16:F27"] },
  6: { sheet: "поток 6", ranges: ["A1:C8","D1:F8","G1:I8"] },
  7: { sheet: "поток 7", ranges: ["A1:C13","D1:F14","A15:C27","D15:F26"] }
};

// ===============================
const container = document.getElementById("tables");
const select = document.getElementById("streamSelect");

let allTables = [];
let pageIndex = 0;
let rotateTimer = null;
let refreshTimer = null;
let currentStream = null;
let loadGeneration = 0;

const PAGE_SIZE = 2;
const ROTATE_MS = 20000;
const REFRESH_MS = 20000;

// ===============================
//   URL CSV
// ===============================
function buildCsvUrl(sheet, range) {
    return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&range=${range}&cacheBust=${Date.now()}`;
}

// ===============================
//   ЗАГРУЗКА ТАБЛИЦЫ
// ===============================
async function loadTable(sheet, range, index, gen) {
    try {
        const res = await fetch(buildCsvUrl(sheet, range));
        const text = await res.text();
        if (gen !== loadGeneration) return null;

        let rows = parseCSV(text)
            .filter(r => !(r.length === 0 || r.every(c => !c.trim())));

        if (rows.length < 3)
            throw new Error("Недостаточно данных");

        // ===============================
        // 1. Снаряд = строго первая строка
        // ===============================
        const apparatus = rows[0][0].trim() || "Снаряд";

        // ===============================
        // 2. Заголовок = строго вторая строка
        // ===============================
        const headerRow = rows[1];
        const nameHeader = headerRow[0] || "ФИО";

        // Определяем индекс колонки «Оценка»
        let scoreCol = 1;
        for (let j = 1; j < headerRow.length; j++) {
            const col = (headerRow[j] || "").toLowerCase();
            if (col.includes("оцен") || col.includes("бал")) {
                scoreCol = j;
                break;
            }
        }
        const scoreHeader = headerRow[scoreCol] || "ОЦЕНКА";

        // ===============================
        // 3. Участники с 3-й строки
        // ===============================
        const participants = rows.slice(2);

        // ===============================
        // 4. Ищем максимум оценки
        // ===============================
        let maxScore = -Infinity;

        participants.forEach(r => {
            let scoreText = r[scoreCol] || "";

            if (!scoreText.trim()) {
                for (let j = scoreCol + 1; j < r.length; j++) {
                    if (!r[j]) continue;
                    const n = parseScore(r[j]);
                    if (!isNaN(n)) {
                        scoreText = r[j];
                        break;
                    }
                }
            }

            const num = parseScore(scoreText);
            if (!isNaN(num) && num > maxScore) maxScore = num;
        });

        // ===============================
        // 5. Собираем HTML
        // ===============================
        let html = `<div class="table-box">
            <div class="table-title">Таблица ${index}</div>
            <div class="apparatus">${apparatus}</div>

            <table>
                <thead>
                    <tr><th>${nameHeader}</th><th>${scoreHeader}</th></tr>
                </thead>
                <tbody>`;

        participants.forEach(r => {
            const fio = r[0] || "-";

            let score = r[scoreCol] || "";
            if (!score.trim()) {
                for (let j = scoreCol + 1; j < r.length; j++) {
                    if (!r[j]) continue;
                    const n = parseScore(r[j]);
                    if (!isNaN(n)) {
                        score = r[j];
                        break;
                    }
                }
            }

            const num = parseScore(score);
            if (!score || isNaN(num)) score = "-";

            const isGold = !isNaN(num) && Math.abs(num - maxScore) < 1e-6;

            html += `<tr class="${isGold ? "gold" : ""}">
                        <td>${fio}</td>
                        <td>${score}</td>
                    </tr>`;
        });

        html += `</tbody></table></div>`;
        return html;

    } catch (err) {
        console.error(err);
        return `<div class="table-box"><div class="table-title">Таблица ${index}</div><div class="apparatus" style="color:#c00;">Ошибка</div></div>`;
    }
}

// ===============================
//     ОТРИСОВКА СТРАНИЦ
// ===============================
function renderPage() {
    if (!allTables.length) {
        container.innerHTML = "<p>Нет данных</p>";
        return;
    }

    const totalPages = Math.ceil(allTables.length / PAGE_SIZE);
    if (pageIndex >= totalPages) pageIndex = 0;

    const start = pageIndex * PAGE_SIZE;
    const slice = allTables.slice(start, start + PAGE_SIZE);

    container.style.gridTemplateColumns = `repeat(${slice.length}, 1fr)`;
    container.innerHTML = slice.join("");

    pageIndex++;
}

// ===============================
//     АВТО ОТРИСОВКА
// ===============================
async function refreshTables() {
    if (!currentStream) return;

    const cfg = STREAMS[currentStream];
    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++)
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));

    if (gen !== loadGeneration) return;
    allTables = tables;
}

// ===============================
//     СМЕНА ПОТОКА
// ===============================
async function renderStream(stream) {
    currentStream = stream;
    const cfg = STREAMS[stream];

    clearInterval(rotateTimer);
    clearInterval(refreshTimer);

    container.innerHTML = "<p>Загрузка...</p>";

    const gen = ++loadGeneration;
    const tables = [];

    for (let i = 0; i < cfg.ranges.length; i++)
        tables.push(await loadTable(cfg.sheet, cfg.ranges[i], i + 1, gen));

    if (gen !== loadGeneration) return;

    allTables = tables;
    pageIndex = 0;

    renderPage();
    if (allTables.length > PAGE_SIZE) rotateTimer = setInterval(renderPage, ROTATE_MS);
    refreshTimer = setInterval(refreshTables, REFRESH_MS);
}

// ===============================
//     ВЫБОР ПОТОКА
// ===============================
select.addEventListener("change", () => {
    if (select.value) renderStream(select.value);
});

    

</script>

</body>
</html>
