<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070605" />
<meta name="robots" content="noindex" />
<link rel="icon" href="logo-emblem.png" />
<title>ArtVin Cup — протокол секретаря</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&family=Kaushan+Script&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070605; --card: #15120e; --card-2: #1d1913;
  --gold-1: #ffe6a8; --gold-2: #f2bd57; --gold-3: #cf902f;
  --gold-grad: linear-gradient(100deg, #fff0c4 0%, #f5c766 30%, #d99a36 62%, #a86f22 100%);
  --text: #f7f2e8; --muted: #9d9483; --line: rgba(242,189,87,.18); --ok: #7fd38a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Montserrat", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { padding: 18px 24px 40px; }
.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.wordmark .artvin { font-weight: 900; font-style: italic; font-size: 28px; }
.wordmark .cup { font-family: "Kaushan Script", cursive; font-size: 30px; margin-left: 4px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top h1 { margin: 0; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 10px; }
select, .btn { font: 600 14px "Montserrat", sans-serif; color: var(--text); background: var(--card-2); border: 1px solid rgba(242,189,87,.3); border-radius: 10px; padding: 9px 12px; }
.btn { cursor: pointer; color: var(--gold-2); }
.btn.on { background: var(--gold-grad); color: #1a1205; border-color: transparent; }
.status { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 14px; }
.status b { color: var(--gold-1); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); border: 1px solid rgba(255,255,255,.08); }
.chips span.ok { color: var(--ok); border-color: rgba(127,211,138,.35); }
.scroll { overflow-x: auto; margin-top: 14px; border: 1px solid rgba(242,189,87,.3); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; }
th { position: sticky; top: 0; background: #1a1611; color: var(--gold-2); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; padding: 10px 8px; text-align: center; border-bottom: 2px solid var(--gold-3); white-space: nowrap; }
th.l, td.l { text-align: left; }
th.cur { color: #1a1205; background: var(--gold-grad); }
td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:nth-child(even) td { background: rgba(255,255,255,.02); }
td.name { font-weight: 700; }
td.muted { color: var(--muted); }
td.sc { font-weight: 700; color: var(--gold-1); }
td.sc.empty { color: rgba(255,255,255,.18); font-weight: 400; }
td.sc.dns { color: var(--muted); font-weight: 600; font-size: 12px; }
td.now { box-shadow: inset 0 0 0 2px rgba(242,189,87,.65); }
td.sum { font-weight: 900; color: #fff; }
td.place { font-weight: 900; }
tr.p1 td.place { color: #1a1205; background: var(--gold-grad); }
tr.sep td { background: rgba(242,189,87,.08) !important; color: var(--gold-2); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; text-align: left; }
.foot { margin-top: 12px; color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 12.5px; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="wordmark"><span class="artvin">ARTVIN</span><span class="cup">Cup</span></div>
    <h1>Протокол секретаря</h1>
    <span id="srcTag" class="note" style="margin:0"></span>
  </div>
  <div class="controls">
    <select id="streamSel"></select>
    <button class="btn" id="byGroup">По группам</button>
    <button class="btn" id="byTotal">По сумме</button>
    <button class="btn" id="csv">Скачать для Excel</button>
  </div>
  <div class="status" id="status"></div>
  <div class="scroll"><table id="tbl"></table></div>
  <div class="foot" id="foot"></div>
  <div class="note">Все оценки хранятся в Google-таблице (вкладка потока) — эта страница только показывает их вместе. Рамкой отмечен снаряд, на котором гимнаст сейчас.</div>
</div>

<script src="core.js"></script>
<script>
const A = ArtVin;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const SRC = params.get("src") === "demo" || params.has("demo") ? "demo" : "sheet";
let settings = [], current = null, stream = null, info = null;
let choice = params.get("stream") || "auto";
let sortBy = "group";

function total(g) {
  let s = 0, n = 0;
  stream.apps.forEach(a => { const v = g.scores[a] && g.scores[a].num; if (v != null) { s += v; n++; } });
  return n ? s : null;
}

// Same rule as the board (A.activeStream): «да» override, else «Начало» in Aktobe time.
let switchT = null, failSince = 0, lastOk = "";
async function load() {
  try {
    const s = await A.loadSettings(SRC);
    if (!s.length) throw new Error("Во вкладке «Настройки» нет потоков");
    const auto = A.activeStream(s, Date.now());
    const sel = $("streamSel");
    const sig = s.map(x => x.tab + x.title).join("|") + "|" + auto.stream.tab;
    if (sel.dataset.sig !== sig) {
      sel.dataset.sig = sig;
      sel.innerHTML = `<option value="auto">● ${A.esc(auto.stream.title)}</option>` + s.map(x => `<option value="${A.esc(x.tab)}">${A.esc(x.title)}</option>`).join("");
    }
    sel.value = choice; if (sel.value !== choice) sel.value = "auto";
    const target = (choice !== "auto" && s.find(x => x.tab === choice)) || auto.stream;
    const data = await A.loadStream(SRC, target);
    settings = s; current = target; stream = data;
    info = A.currentRotation(stream, current, null);
    render();
    if (choice === "auto" && auto.status === "upcoming") $("status").insertAdjacentHTML("afterbegin", `<span><b>${A.esc(A.startsLabel(current, Date.now()))}</b></span>`);
    failSince = 0; lastOk = new Date().toLocaleTimeString("ru-RU");
    $("foot").textContent = "Обновлено " + lastOk + (SRC === "demo" ? " · демо" : "");
    clearTimeout(switchT);
    const dt = choice === "auto" && auto.next ? auto.next.start - Date.now() : 0;
    if (dt > 0 && dt < 6 * 3600000) switchT = setTimeout(load, dt + 300);   // switch at the same minute as the board
  } catch (e) {
    console.error(e);
    if (stream) {
      // keep the protocol on screen; only after ~60 s of failures say so
      if (!failSince) failSince = Date.now();
      if (Date.now() - failSince >= 60000) $("foot").textContent = `⚠ Нет связи с таблицей · данные от ${lastOk} · ${e.message}`;
      return;
    }
    $("status").innerHTML = "<b>Нет данных из Google-таблицы:</b>&nbsp;" + A.esc(e.message) +
      "";
    $("tbl").innerHTML = "";
  }
}

function render() {
  const prog = A.rotationProgress(stream, info.rotation);
  $("status").innerHTML = (info.finished ? "<b>Поток завершён</b> · все снаряды пройдены" :
    `<span>Ротация <b>${info.rotation}</b> из ${info.total}</span>`) +
    `<span>Режим: ${A.ROT_MODES[info.mode]}</span>` +
    `<div class="chips">${stream.apps.map(a => {
      const p = prog[a]; return `<span class="${p.total && p.done === p.total ? "ok" : ""}">${A.APPARATUS[a].short} ${p.done}/${p.total}</span>`;
    }).join("")}</div>` +
    A.streamWarnings(stream).map(w => `<span style="color:#ff9b8b">⚠ ${A.esc(w)}</span>`).join("");

  // all-around totals and places
  const rows = stream.gymnasts.map(g => ({ g, sum: total(g), now: g.start ? A.appAtRotation(g.start, info.rotation, stream.gender) : null }));
  const ranked = rows.filter(r => r.sum != null).sort((a, b) => b.sum - a.sum);
  rows.forEach(r => { r.place = r.sum == null ? null : 1 + ranked.filter(x => x.sum > r.sum + 1e-9).length; });

  const head = `<tr><th>№</th><th class="l">ФИО</th><th>Год</th><th class="l">Клуб</th><th>Старт</th>${
    stream.apps.map(a => `<th>${A.APPARATUS[a].short}</th>`).join("")}<th>Сумма</th><th>1-е место</th></tr>`;

  let list = rows.slice();
  let body = "";
  const line = (r, i) => {
    const cls = r.place === 1 ? "p1" : "";
    return `<tr class="${cls}"><td class="muted">${i}</td><td class="l name">${A.esc(r.g.name)}</td><td class="muted">${A.esc(r.g.year)}</td>
      <td class="l muted">${A.esc(r.g.club)}</td><td class="muted">${r.g.start ? A.APPARATUS[r.g.start].short : "—"}</td>${
      stream.apps.map(a => {
        const s = r.g.scores[a] || { raw: "", num: null };
        const now = !info.finished && r.now === a ? " now" : "";
        if (s.raw === "") return `<td class="sc empty${now}">·</td>`;
        if (s.num === 0) return `<td class="sc dns${now}">н/я</td>`;
        return `<td class="sc${now}">${s.num != null ? A.fmtScore(s.num) : A.esc(s.raw)}</td>`;
      }).join("")}<td class="sum">${r.sum != null ? A.fmtScore(r.sum) : ""}</td><td class="place">${r.place === 1 ? 1 : ""}</td></tr>`;
  };
  if (sortBy === "total") {
    list.sort((a, b) => (b.sum ?? -1) - (a.sum ?? -1) || a.g.idx - b.g.idx);
    body = list.map((r, i) => line(r, i + 1)).join("");
  } else {
    const order = A.ORDER[stream.gender];
    const cols = 7 + stream.apps.length;
    order.forEach(start => {
      const grp = list.filter(r => r.g.start === start);
      if (!grp.length) return;
      body += `<tr class="sep"><td colspan="${cols}">Группа со старта: ${A.APPARATUS[start].full}${
        !info.finished ? " · сейчас: " + A.APPARATUS[A.appAtRotation(start, info.rotation, stream.gender)].short : ""}</td></tr>`;
      body += grp.map((r, i) => line(r, i + 1)).join("");
    });
    const loose = list.filter(r => !r.g.start);
    if (loose.length) body += `<tr class="sep"><td colspan="${cols}">Без стартового снаряда</td></tr>` + loose.map((r, i) => line(r, i + 1)).join("");
  }
  $("tbl").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
  $("byGroup").classList.toggle("on", sortBy === "group");
  $("byTotal").classList.toggle("on", sortBy === "total");
  window._rows = rows;
}

function downloadCSV() {
  const rows = window._rows || [];
  const head = ["№", "ФИО", "Год", "Клуб", "Старт"].concat(stream.apps.map(a => A.APPARATUS[a].full), ["Сумма", "Место"]);
  const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(";")].concat(rows.map((r, i) => [i + 1, r.g.name, r.g.year, r.g.club, r.g.start ? A.APPARATUS[r.g.start].short : ""]
    .concat(stream.apps.map(a => { const s = r.g.scores[a]; return s && s.num != null ? s.num.toFixed(3).replace(".", ",") : ""; }),
      [r.sum != null ? r.sum.toFixed(3).replace(".", ",") : "", r.place || ""]).map(q).join(";")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ArtVin Cup — ${current.title}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$("streamSel").onchange = e => { choice = e.target.value; load(); };
$("byGroup").onclick = () => { sortBy = "group"; render(); };
$("byTotal").onclick = () => { sortBy = "total"; render(); };
$("csv").onclick = downloadCSV;
window.addEventListener("storage", e => { if (SRC === "demo" && e.key === A.DEMO_KEY) load(); });
$("srcTag").textContent = SRC === "demo" ? "демо-данные" : "";
load();
setInterval(load, SRC === "demo" ? 3000 : 10000);
</script>
</body>
</html>
