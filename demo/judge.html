<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070605" />
<meta name="robots" content="noindex" />
<link rel="icon" href="logo-emblem.png" />
<title>ArtVin Cup — судья</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&family=Kaushan+Script&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #070605; --card: #15120e; --card-2: #1d1913;
  --gold-1: #ffe6a8; --gold-2: #f2bd57; --gold-3: #cf902f;
  --gold-grad: linear-gradient(100deg, #fff0c4 0%, #f5c766 30%, #d99a36 62%, #a86f22 100%);
  --text: #f7f2e8; --muted: #9d9483; --line: rgba(242,189,87,.18);
  --ok: #7fd38a; --err: #ff7b6b;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: radial-gradient(900px 400px at 100% -10%, rgba(217,154,54,.18), transparent 60%), var(--bg);
  color: var(--text); font-family: "Montserrat", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 90px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.wordmark { white-space: nowrap; }
.wordmark .artvin { font-weight: 900; font-style: italic; font-size: 22px; }
.wordmark .cup { font-family: "Kaushan Script", cursive; font-size: 24px; margin-left: 4px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.role { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

.app-card { margin: 14px 0 12px; padding: 16px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.app-card h1 { margin: 0; font-size: 30px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .03em;
  background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lock { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--gold-1);
  padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(242,189,87,.35); background: rgba(242,189,87,.07); }
.controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
select, .btn {
  font: 600 15px "Montserrat", sans-serif; color: var(--text); background: var(--card-2);
  border: 1px solid rgba(242,189,87,.3); border-radius: 10px; padding: 10px 12px;
}
select { flex: 1; min-width: 200px; }
.stream-now { flex: 1; min-width: 200px; font-size: 15px; color: var(--muted); padding: 10px 2px; }
.stream-now b { color: var(--text); }
.btn { cursor: pointer; color: var(--gold-2); }
.btn.on { background: var(--gold-grad); color: #1a1205; border-color: transparent; }
.rotline { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.rotline b { color: var(--gold-2); }

.status { margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; border: 1px solid var(--line); background: var(--card); }
.status b { color: var(--gold-1); }
.status.wait { border-color: rgba(127,211,138,.45); }
.status.new { border-color: var(--gold-2); background: rgba(242,189,87,.12); animation: pulse 1.2s ease 3; }
.status.fin { border-color: rgba(127,211,138,.45); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(242,189,87,.25); } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); border: 1px solid rgba(255,255,255,.08); }
.chips span.ok { color: var(--ok); border-color: rgba(127,211,138,.35); }
.chips span.me { color: var(--gold-1); border-color: rgba(242,189,87,.45); }
.group-title { margin: 18px 4px 8px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-2); font-weight: 700; }
.g {
  display: grid; grid-template-columns: 2em minmax(0,1fr) auto; gap: 10px; align-items: center;
  padding: 10px 10px 10px 8px; margin-bottom: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
}
.g .n { text-align: center; color: var(--muted); font-weight: 800; }
.g .who b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
.g .who span { font-size: 12px; color: var(--muted); }
.g .entry { display: flex; gap: 6px; align-items: center; }
.g input {
  width: 92px; font: 800 20px "Montserrat", sans-serif; text-align: center; font-variant-numeric: tabular-nums;
  color: #fff; background: #0d0b08; border: 1px solid rgba(242,189,87,.35); border-radius: 10px; padding: 9px 6px;
}
.g input:focus { outline: 2px solid var(--gold-2); }
.g button.save { width: 46px; height: 44px; border-radius: 10px; border: 0; background: var(--gold-grad); color: #1a1205; font-size: 20px; font-weight: 900; cursor: pointer; }
.g button.dns { height: 44px; padding: 0 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: transparent; color: var(--muted); font: 700 11px "Montserrat"; cursor: pointer; }
.g .st { grid-column: 2 / 4; font-size: 12px; min-height: 0; }
.g .st:empty { display: none; }
.g.saved { border-color: rgba(127,211,138,.45); }
.g.saved input { border-color: rgba(127,211,138,.6); }
.g .st.ok { color: var(--ok); } .g .st.err { color: var(--err); } .g .st.busy { color: var(--gold-1); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: rgba(7,6,5,.94); border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); text-align: center; }
.foot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.foot .dot.bad { background: var(--err); }
.login { margin-top: 30px; padding: 22px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-align: center; }
.login h2 { margin: 0 0 6px; font-size: 20px; }
.login p { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.login input { width: 100%; max-width: 280px; font: 800 30px "Montserrat", sans-serif; letter-spacing: .18em; text-align: center;
  color: #fff; background: #0d0b08; border: 1px solid rgba(242,189,87,.45); border-radius: 12px; padding: 12px 8px; }
.login button { display: block; margin: 14px auto 0; width: 100%; max-width: 280px; padding: 13px; border: 0; border-radius: 12px;
  background: var(--gold-grad); color: #1a1205; font: 800 17px "Montserrat", sans-serif; cursor: pointer; }
.login button:disabled { opacity: .6; }
.login .err { color: var(--err); margin-top: 12px; min-height: 1.2em; font-size: 14px; }
.login .demo { margin-top: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
.login .demo code { color: var(--gold-1); font-size: 13px; }
.pick h3 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-2); text-align: left; }
.pick .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick .grid button { margin: 0; max-width: none; padding: 16px 8px; background: var(--card-2); color: var(--text);
  border: 1px solid rgba(242,189,87,.3); font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pick .grid button:hover { border-color: var(--gold-2); }
.pick .grid button::before { content: "🔒"; font-size: 13px; opacity: .7; }
.login .back { background: none; color: var(--muted); border: 0; font-size: 13px; margin-top: 12px; text-decoration: underline; }
.login h2 small { display: block; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.logout { background: none; border: 1px solid rgba(255,255,255,.15); color: var(--muted); border-radius: 999px; padding: 5px 12px;
  font: 600 12px "Montserrat", sans-serif; cursor: pointer; margin-left: 10px; }
.nokey { margin-top: 30px; padding: 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); line-height: 1.55; }
.nokey a { color: var(--gold-1); margin-right: 10px; display: inline-block; margin-top: 6px; }
@media (max-width: 420px) {
  .g { grid-template-columns: 1.6em minmax(0,1fr); }
  .g .entry { grid-column: 1 / 3; justify-content: flex-end; }
  .g .st { grid-column: 1 / 3; text-align: right; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="wordmark"><span class="artvin">ARTVIN</span><span class="cup">Cup</span></div>
    <div><span class="role" id="role">судья</span><button class="logout" id="logout" hidden>Выйти</button></div>
  </div>
  <div id="app"></div>
</div>
<div class="foot" id="foot"></div>

<script src="core.js"></script>
<script>
const A = ArtVin;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
// The judge's code decides the apparatus (checked by the server). It can come from the link (?key=…)
// or be typed on the login screen; it is remembered on this device until «Выйти».
const DEMO = params.has("demo") || (params.get("key") || "").startsWith("demo-");
const CODE_STORE = DEMO ? "artvin-judge-code-demo" : "artvin-judge-code";
let KEY = (params.get("key") || "").trim();
if (!KEY) { try { KEY = localStorage.getItem(CODE_STORE) || ""; } catch (e) {} }
// demo codes (demo mode only)
const DEMO_CODES = {};
A.ORDER.M.forEach((a, i) => (DEMO_CODES["1111000" + (i + 1)] = "M:" + a));
A.ORDER.F.forEach((a, i) => (DEMO_CODES["2222000" + (i + 1)] = "F:" + a));
const SRC = DEMO ? "demo" : "script";
const UI = "artvin-judge-ui";

let me = null;              // { gender, app }
let settings = [], current = null, stream = null, info = null;
let showAll = false;
let lastRot = null, newGroupUntil = 0;
// One stream runs at a time: judges always follow the stream marked «На экране».
// A manual pick lasts only until the page is reopened, so nobody is left on yesterday's stream.
const streamChoice = "auto";   // the organiser picks the stream (button «Поток» on the board)
try { const u = JSON.parse(localStorage.getItem(UI)) || {}; showAll = !!u.showAll; } catch (e) {}
const saveUI = () => { try { localStorage.setItem(UI, JSON.stringify({ showAll })); } catch (e) {} };

/* ---------- identity (the key decides the apparatus; it cannot be changed on this page) ---------- */
async function whoami() {
  if (DEMO) {
    const code = DEMO_CODES[KEY.replace(/[\s-]/g, "")];
    const m = code ? code.match(/^([MF]):(\w+)$/) : KEY.match(/^demo-([MF])-(\w+)$/);
    if (!m || !A.ORDER[m[1]].includes(m[2])) throw new Error("Неверный код судьи");
    return { gender: m[1], app: m[2] };
  }
  const j = await A.scriptGet({ action: "whoami", key: KEY });
  return { gender: j.gender, app: j.app };
}

/* ---------- write ---------- */
async function writeScore(g, value, expected) {
  if (DEMO) {
    // same checks as the server: apparatus comes only from the key
    const d = A.demoInit();
    const st = settings.find(s => s.tab === current.tab);
    if (!st || st.gender !== me.gender) throw new Error("Этот поток не для вашего снаряда");
    const chosen = A.parseSettings(d.settings).find(x => x.active);
    if (chosen && chosen.tab !== current.tab) throw new Error(`Сейчас оценки принимаются только в поток «${chosen.tab}»`);
    const values = d.tabs[current.tab];
    const parsed = A.parseStream(values, st.gender, 1);
    const col = parsed.appCols[me.app];
    if (col == null) throw new Error("В таблице нет колонки вашего снаряда");
    if (A.norm(values[g.row - 1][parsed.nameCol]) !== A.norm(g.name)) throw new Error("Строка изменилась — обновите");
    const now = values[g.row - 1][col] || "";
    if (!A.sameScore(now, expected)) {
      const e = new Error("Оценку уже изменили на другом устройстве: " + (now || "пусто"));
      e.conflict = true; e.current = now; throw e;
    }
    values[g.row - 1][col] = value;
    A.demoSave(d);
    return;
  }
  await A.scriptPost({ action: "score", key: KEY, tab: current.tab, row: g.row, name: g.name, value, expected });
}

/* ---------- load ---------- */
// Same rule as the board (A.activeStream): «да» override, else «Начало» in Aktobe time.
let offStream = null;
let pick = null, autoPick = null, switchT = null, failSince = 0;
async function load() {
  if (!me) return;   // logged out
  try {
    const all = await A.loadSettings(SRC);
    settings = all.filter(s => s.gender === me.gender);
    if (!settings.length) throw new Error("Нет потоков для этого снаряда");
    autoPick = A.activeStream(all, Date.now(), me.gender);
    // organiser chose a stream of the other gender → this apparatus has nothing to score now
    const chosenAll = all.find(s => s.active);
    offStream = chosenAll && chosenAll.gender !== me.gender ? chosenAll : null;
    const chosen = streamChoice !== "auto" && settings.find(s => s.tab === streamChoice);
    pick = chosen ? { stream: chosen, status: "chosen", next: null } : autoPick;
    let target = pick.stream;
    // never swap the stream under a score the judge is still typing — that row belongs to the shown stream
    if (current && target.tab !== current.tab && document.querySelector(".g input[data-dirty]")) {
      target = settings.find(s => s.tab === current.tab) || current;
    }
    const data = await A.loadStream(SRC, target);
    if (current && target.tab !== current.tab && document.querySelector(".g input[data-dirty]")) return;   // started typing meanwhile
    current = target; stream = data;
    info = A.currentRotation(stream, current, null);
    render();
    failSince = 0;
    setFoot(true);
    clearTimeout(switchT);
    const dt = pick.next ? pick.next.start - Date.now() : 0;
    if (dt > 0 && dt < 6 * 3600000) switchT = setTimeout(load, dt + 300);   // switch at the same minute as the board
  } catch (e) {
    console.error(e);
    // keep the list and typed scores; only after ~60 s of failures say so
    if (!failSince) failSince = Date.now();
    if (!stream || Date.now() - failSince >= 60000) setFoot(false, e.message);
  }
}
function rotText() {
  return `Ротация <b>${info.rotation}</b> из ${info.total} · режим: ${A.ROT_MODES[info.mode]}` +
    (pick && pick.status === "upcoming" ? ` · <b>${A.esc(A.startsLabel(current, Date.now()))}</b>` : "");
}

function setFoot(ok, msg) {
  const t = new Date().toLocaleTimeString("ru-RU");
  $("foot").innerHTML = ok
    ? `<span class="dot"></span>Связь есть · обновлено ${t}${DEMO ? " · демо" : ""}`
    : `<span class="dot bad"></span>${A.esc(msg || "Нет связи")} · ${t}`;
}

/* ---------- render ---------- */
let renderedSig = "";
function render() {
  if (offStream) {
    renderedSig = "";
    $("app").innerHTML = `<div class="app-card"><h1>${A.esc(A.APPARATUS[me.app].full)}</h1>
      <div class="lock">🔒 Вы можете ставить оценки только на этом снаряде</div></div>
      <div class="status">Сейчас идёт поток <b>«${A.esc(offStream.title)}»</b> (${offStream.gender === "F" ? "девочки" : "мальчики"}).
      Для вашего снаряда оценок нет — список появится сам, когда организатор включит ваш поток.</div>`;
    return;
  }
  const groups = A.groupsAt(stream, info.rotation);
  const mine = groups[me.app] || [];
  const order = A.ORDER[me.gender];

  // which group(s) to show
  let sections;
  if (showAll) {
    sections = order.map(start => ({
      title: "Старт: " + A.APPARATUS[start].short + (A.appAtRotation(start, info.rotation, me.gender) === me.app ? " · сейчас у вас" : ""),
      list: stream.gymnasts.filter(g => g.start === start),
    })).filter(s => s.list.length);
    const loose = stream.gymnasts.filter(g => !g.start);
    if (loose.length) sections.push({ title: "Без стартового снаряда", list: loose });
  } else {
    sections = [{ title: "Сейчас на снаряде", list: mine }];
  }

  // rotation status: done / waiting for others / new group / finished
  if (lastRot != null && info.rotation > lastRot) {
    newGroupUntil = Date.now() + 15000;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  lastRot = info.rotation;
  const prog = A.rotationProgress(stream, info.rotation);
  const my = prog[me.app] || { done: 0, total: 0 };
  const chips = stream.apps.map(a => {
    const p = prog[a];
    const cls = a === me.app ? "me" : (p.total && p.done === p.total ? "ok" : "");
    return `<span class="${cls}">${A.APPARATUS[a].short} ${p.done}/${p.total}</span>`;
  }).join("");
  let statusCls = "", statusText;
  if (info.finished) { statusCls = "fin"; statusText = "<b>Поток завершён.</b> Все оценки у секретаря."; }
  else if (Date.now() < newGroupUntil) { statusCls = "new"; statusText = `<b>Ротация ${info.rotation}: к вам пришла новая группа.</b> Список обновлён.`; }
  else if (my.total && my.done === my.total) {
    statusCls = "wait";
    statusText = info.mode === "auto"
      ? "<b>Ваша группа готова ✓</b> Ждём другие снаряды — новая группа появится здесь автоматически."
      : "<b>Ваша группа готова ✓</b> Следующая группа появится после смены ротации.";
  } else statusText = `Выставлено <b>${my.done} из ${my.total}</b> оценок на вашем снаряде.`;
  const statusHtml = `<div class="status ${statusCls}" id="status">${statusText}<div class="chips">${chips}</div></div>`;

  const sig = current.tab + "|" + info.rotation + "|" + showAll + "|" + sections.map(s => s.list.map(g => g.row + g.name).join(",")).join("/");
  const head = `
    <div class="app-card">
      <h1>${A.esc(A.APPARATUS[me.app].full)}</h1>
      <div class="lock">🔒 Вы можете ставить оценки только на этом снаряде</div>
      <div class="controls">
        <div class="stream-now" id="streamNow">Поток: <b>${A.esc(current.title)}</b></div>
        <button class="btn ${showAll ? "on" : ""}" id="allBtn">Весь поток</button>
      </div>
      ${A.streamWarnings(stream).map(w => `<div class="rotline" style="color:#ff9b8b">⚠ ${A.esc(w)}</div>`).join("")}
      <div class="rotline" id="rotline">${rotText()}</div>
    </div>`;

  // don't swap the list while the judge is typing a score — wait until it's saved
  const typing = renderedSig && sig !== renderedSig && document.querySelector(".g input[data-dirty]");
  if (typing) {
    $("status").outerHTML = `<div class="status new" id="status"><b>Пришла новая группа.</b> Сохраните текущую оценку — список обновится.<div class="chips">${chips}</div></div>`;
    return;
  }
  if (sig !== renderedSig) {
    renderedSig = sig;
    $("app").innerHTML = head + statusHtml + sections.map(s => `
      <div class="group-title">${A.esc(s.title)}</div>
      ${s.list.length ? s.list.map((g, i) => rowHtml(g, i + 1)).join("") : '<div class="empty">На этом снаряде сейчас никого нет</div>'}
    `).join("");
    $("allBtn").onclick = () => { showAll = !showAll; saveUI(); renderedSig = ""; render(); };
  } else {
    // refresh values without disturbing what the judge is typing
    document.querySelectorAll(".g").forEach(el => {
      const g = stream.gymnasts.find(x => String(x.row) === el.dataset.row);
      if (!g) return;
      const inp = el.querySelector("input");
      const raw = (g.scores[me.app] || {}).raw || "";
      if (document.activeElement !== inp && !inp.dataset.dirty) inp.value = shown(raw);
      el.classList.toggle("saved", raw !== "");
    });
    $("status").outerHTML = statusHtml;
    $("rotline").innerHTML = rotText();
  }
}

function shown(raw) {
  const n = A.parseScore(raw);
  if (raw === "") return "";
  return n === 0 ? "н/я" : (n == null ? raw : A.fmtScore(n));
}

function rowHtml(g, n) {
  const raw = (g.scores[me.app] || {}).raw || "";
  return `<div class="g ${raw !== "" ? "saved" : ""}" data-row="${g.row}">
    <span class="n">${n}</span>
    <div class="who"><b>${A.esc(g.name)}</b><span>${A.esc([g.year, g.club].filter(Boolean).join(" · "))}</span></div>
    <div class="entry">
      <input inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="9,250" value="${A.esc(shown(raw))}" aria-label="Оценка ${A.esc(g.name)}" />
      <button class="save" title="Сохранить">✓</button>
      <button class="dns" title="Не выступал">Н/Я</button>
    </div>
    <div class="st"></div>
  </div>`;
}

/* ---------- interactions ---------- */
function validate(text) {
  const t = String(text).trim();
  if (t === "") return { value: "" };
  if (/^н\/?я$/i.test(t)) return { value: "0" };
  if (!/^\d{1,2}([.,]\d{1,3})?$/.test(t)) return { error: "Формат: 12,350 (до 3 знаков после запятой)" };
  const n = A.parseScore(t);
  if (n < 0 || n > A.CONFIG.MAX_SCORE) return { error: "Оценка должна быть от 0 до " + A.CONFIG.MAX_SCORE };
  return { value: n.toFixed(3) };
}

async function submit(el, forced) {
  const g = stream.gymnasts.find(x => String(x.row) === el.dataset.row);
  if (!g) return;
  const inp = el.querySelector("input");
  const st = el.querySelector(".st");
  const v = forced != null ? { value: forced } : validate(inp.value);
  if (v.error) { st.className = "st err"; st.textContent = v.error; inp.focus(); return false; }
  const old = (g.scores[me.app] || {}).raw || "";
  if (old === "" && v.value === "") { st.className = "st"; st.textContent = ""; delete inp.dataset.dirty; return false; }
  const oldN = A.parseScore(old), newN = A.parseScore(v.value);
  if (old !== "" && (oldN == null || newN == null || Math.abs(oldN - newN) > 1e-9)) {
    const msg = v.value === "" ? `Удалить оценку ${shown(old)} у ${g.name}?` : `Изменить оценку ${g.name}: ${shown(old)} → ${shown(v.value)}?`;
    if (!confirm(msg)) { inp.value = shown(old); delete inp.dataset.dirty; return false; }
  } else if (old !== "" && v.value !== "" && Math.abs(oldN - newN) < 1e-9) {
    st.className = "st ok"; st.textContent = "Уже сохранено"; delete inp.dataset.dirty; return true;
  }
  st.className = "st busy"; st.textContent = "Сохраняю…";
  try {
    await writeScore(g, v.value, old);
    setLocal(g, v.value);
    inp.value = shown(v.value); delete inp.dataset.dirty;
    el.classList.toggle("saved", v.value !== "");
    st.className = "st ok"; st.textContent = v.value === "" ? "Оценка удалена" : "✓ Сохранено — на табло через несколько секунд";
    setTimeout(() => { if (st.classList.contains("ok")) st.textContent = ""; }, 4000);
    info = A.currentRotation(stream, current, null);
    render();
    return true;
  } catch (e) {
    if (e.conflict) {
      // someone else saved first: show their value, the judge decides again
      setLocal(g, e.current || "");
      inp.value = shown(e.current || ""); delete inp.dataset.dirty;
      el.classList.toggle("saved", !!e.current);
    }
    st.className = "st err"; st.textContent = "Не сохранено: " + e.message;
    return false;
  }
}
// keep both the row we edited and the latest loaded copy of the stream in sync
function setLocal(g, raw) {
  const val = { raw, num: A.parseScore(raw) };
  g.scores[me.app] = val;
  const fresh = stream && stream.gymnasts.find(x => x.row === g.row && x.name === g.name);
  if (fresh) fresh.scores[me.app] = val;
}

document.addEventListener("click", e => {
  const el = e.target.closest(".g"); if (!el) return;
  if (e.target.closest("button.save")) submit(el);
  if (e.target.closest("button.dns")) { el.querySelector("input").value = "н/я"; submit(el, "0"); }
});
document.addEventListener("input", e => { if (e.target.matches(".g input")) e.target.dataset.dirty = "1"; });
document.addEventListener("keydown", async e => {
  if (e.key !== "Enter" || !e.target.matches(".g input")) return;
  e.preventDefault();
  const el = e.target.closest(".g");
  const ok = await submit(el);
  if (ok) {
    const all = [...document.querySelectorAll(".g")];
    const next = all[all.indexOf(el) + 1];
    if (next) next.querySelector("input").focus();
  }
});
window.addEventListener("storage", e => { if (DEMO && e.key === A.DEMO_KEY) load(); });

/* ---------- start: code entry ---------- */
let pollTimer = null;
// Step 1: the judge picks an apparatus. Step 2: that apparatus asks for its code.
// The server still decides the apparatus from the code — picking here only says which code is expected.
function showLogin(msg) {
  $("logout").hidden = true;
  $("role").textContent = "судья";
  const btn = (g, a) => `<button type="button" data-g="${g}" data-app="${a}">${A.APPARATUS[a].short === "Брусья" && g === "F" ? "Брусья (Ж)" : A.APPARATUS[a].short}</button>`;
  $("app").innerHTML = `<div class="login pick">
      <h2>Вход для судьи</h2>
      <p>Выберите свой снаряд. Чтобы открыть его, нужен код снаряда от организатора.</p>
      <h3>Мальчики</h3><div class="grid">${A.ORDER.M.map(a => btn("M", a)).join("")}</div>
      <h3>Девочки</h3><div class="grid">${A.ORDER.F.map(a => btn("F", a)).join("")}</div>
      <div class="err">${A.esc(msg || "")}</div>
    </div>`;
  $("app").querySelectorAll(".grid button").forEach(b => (b.onclick = () => showCodeFor(b.dataset.g, b.dataset.app)));
}
function showCodeFor(g, app, msg) {
  $("logout").hidden = true;
  const demoCode = DEMO && Object.keys(DEMO_CODES).find(c => DEMO_CODES[c] === g + ":" + app);
  $("app").innerHTML = `<form class="login" id="loginForm">
      <h2>🔒 ${A.esc(A.APPARATUS[app].full)}<small>${g === "F" ? "девочки" : "мальчики"}</small></h2>
      <p>Введите код этого снаряда.</p>
      <input id="code" inputmode="numeric" autocomplete="off" placeholder="0000 0000" maxlength="11" aria-label="Код снаряда" />
      <button id="loginBtn">Открыть снаряд</button>
      <div class="err" id="loginErr">${A.esc(msg || "")}</div>
      ${demoCode ? `<div class="demo">Демо-код: <code>${demoCode.slice(0, 4)} ${demoCode.slice(4)}</code></div>` : ""}
      <button type="button" class="back" id="back">← другой снаряд</button>
    </form>`;
  $("code").focus();
  $("back").onclick = () => showLogin();
  $("loginForm").onsubmit = async e => {
    e.preventDefault();
    const v = $("code").value.trim();
    if (!/^\d[\d\s-]{6,}\d$/.test(v)) { $("loginErr").textContent = "Код — 8 цифр"; return; }
    $("loginBtn").disabled = true; $("loginErr").textContent = "Проверяю…";
    KEY = v;
    await start(true, { g, app });
  };
}
async function start(fromLogin, wanted) {
  try {
    if (DEMO) A.demoInit();
    me = await whoami();
    if (wanted && (me.gender !== wanted.g || me.app !== wanted.app)) {
      me = null; KEY = "";
      showCodeFor(wanted.g, wanted.app, "Это код другого снаряда");
      return;
    }
    try { localStorage.setItem(CODE_STORE, KEY); } catch (e) {}
    // don't leave the code in the address bar
    if (params.get("key")) history.replaceState(null, "", location.pathname + (DEMO ? "?demo=1" : ""));
    $("role").textContent = "судья · " + (me.gender === "F" ? "девочки" : "мальчики");
    $("logout").hidden = false;
    document.title = "Судья · " + A.APPARATUS[me.app].short + " — ArtVin Cup";
    renderedSig = "";
    await load();
    clearInterval(pollTimer);
    pollTimer = setInterval(load, DEMO ? 3000 : 8000);
  } catch (e) {
    try { localStorage.removeItem(CODE_STORE); } catch (x) {}
    KEY = "";
    if (wanted) { showCodeFor(wanted.g, wanted.app, e.message); return; }
    showLogin(fromLogin ? e.message : (e.message === "Неверный код судьи" ? "Код больше не действует — введите новый" : e.message));
  }
}
$("logout").onclick = () => {
  if (!confirm("Выйти? Чтобы снова ставить оценки, нужно будет ввести код.")) return;
  try { localStorage.removeItem(CODE_STORE); } catch (e) {}
  clearInterval(pollTimer); me = null; KEY = ""; showLogin();
};
const wantApp = params.get("app"), wantG = params.get("g") === "F" ? "F" : "M";
if (KEY) start(false);
else if (wantApp && A.ORDER[wantG].includes(wantApp)) showCodeFor(wantG, wantApp);
else showLogin();
</script>
</body>
